<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Carnet Secret — Ida & Aidara</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
/* ============ TOKENS ============ */
:root{
  --paper:        #16141A;
  --paper-2:      #1F1C22;
  --ink:          #E8E2DC;
  --ink-soft:     #948C90;
  --ribbon:       #6E3F49;
  --ribbon-2:     #8C5560;
  --thread:       #8C7452;
  --leaf:         #55524F;
  --leaf-2:       #6B6660;
  --line:         #2A2731;
  --bubble-mine:  linear-gradient(155deg, #8C5560 0%, #6E3F49 100%);
  --bubble-mine-text: #F3E9E6;
  --bubble-theirs: #242028;
  --bubble-theirs-text: #E8E2DC;
  --shadow: 0 8px 28px -10px rgba(0,0,0,0.6);
  --radius-bubble: 20px;
  --font-display: 'Fraunces', serif;
  --font-body: 'Work Sans', sans-serif;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  font-family:var(--font-body);
  background:var(--paper);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  overscroll-behavior:none;
}
button{font-family:inherit;cursor:pointer;}
::selection{background:var(--ribbon-2); color:#fff;}

/* focus visibility */
button:focus-visible, input:focus-visible, textarea:focus-visible{
  outline:2px solid var(--thread);
  outline-offset:2px;
}

/* ============ APP SHELL ============ */
#app{
  height:100vh;
  height:100dvh;
  max-width:520px;
  margin:0 auto;
  display:flex;
  flex-direction:column;
  position:relative;
  background:var(--paper);
  box-shadow:0 0 40px rgba(0,0,0,0.15);
}

/* ============ SCREEN: PROFILE PICK ============ */
#screen-profile{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:34px;
  padding:32px;
  text-align:center;
  background:
    radial-gradient(circle at 20% 15%, rgba(140,85,96,0.10), transparent 45%),
    radial-gradient(circle at 85% 85%, rgba(85,82,79,0.10), transparent 50%),
    var(--paper);
}
.cover{
  width:150px;height:196px;
  border-radius:6px 12px 12px 6px;
  background:linear-gradient(160deg, var(--ribbon-2), var(--ribbon) 70%);
  box-shadow:var(--shadow), inset -6px 0 0 rgba(0,0,0,0.12);
  position:relative;
  display:flex;align-items:center;justify-content:center;
}
.cover::before{
  content:"";
  position:absolute;
  left:14px; top:0; bottom:0;
  width:2px;
  background:rgba(255,255,255,0.25);
}
.cover .cover-ribbon{
  position:absolute;
  top:-4px;
  right:22px;
  width:20px;
  height:64px;
  background:var(--thread);
  clip-path:polygon(0 0,100% 0,100% 100%,50% 78%,0 100%);
  box-shadow:0 2px 6px rgba(0,0,0,0.25);
}
.cover span{
  font-family:var(--font-display);
  font-style:italic;
  font-weight:500;
  color:rgba(255,255,255,0.92);
  font-size:15px;
  letter-spacing:0.03em;
  transform:rotate(-3deg);
}
#screen-profile h1{
  font-family:var(--font-display);
  font-weight:600;
  font-size:30px;
  margin:0;
  letter-spacing:-0.01em;
}
#screen-profile p.sub{
  margin:6px 0 0;
  color:var(--ink-soft);
  font-size:15px;
  max-width:280px;
}
.profile-choices{
  display:flex;
  gap:16px;
  width:100%;
  max-width:340px;
}
.profile-btn{
  flex:1;
  border:1px solid var(--line);
  background:var(--paper-2);
  border-radius:16px;
  padding:20px 10px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:10px;
  transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;
  color:var(--ink);
}
.profile-btn:hover{
  transform:translateY(-4px);
  box-shadow:var(--shadow);
  border-color:var(--ribbon-2);
}
.profile-avatar{
  width:52px;height:52px;
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-display);
  font-weight:600;
  font-size:20px;
  color:#fff;
}
.profile-btn[data-id="ida"] .profile-avatar{background:linear-gradient(155deg, var(--ribbon-2), var(--ribbon));}
.profile-btn[data-id="aidara"] .profile-avatar{background:linear-gradient(155deg, var(--leaf-2), var(--leaf));}
.profile-btn strong{font-size:15px; font-weight:600;}
.profile-btn small{font-size:12px; color:var(--ink-soft);}

/* ============ SCREEN: CHAT ============ */
#screen-chat{
  flex:1;
  display:none;
  flex-direction:column;
  min-height:0;
}
#screen-chat.active{display:flex;}
#screen-profile.hidden{display:none;}

.status-bar{
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:8px 14px;
  background:var(--paper);
  position:relative;
  z-index:5;
}
.status-bar-info{
  display:flex;
  align-items:baseline;
  gap:8px;
  min-width:0;
  overflow:hidden;
}
.sb-status{
  font-size:12px;
  color:var(--ink-soft);
  opacity:0.85;
  display:flex;align-items:center;gap:5px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.sb-status .dot-online{
  display:inline-block;
  width:7px;height:7px;
  border-radius:50%;
  background:#8FA88E;
  box-shadow:0 0 0 2px rgba(143,168,142,0.2);
}
.sb-status .typing-dots{display:flex; gap:2px;}
.sb-status .typing-dots span{
  width:4px;height:4px;border-radius:50%;
  background:var(--ink-soft);
  animation:tblink 1.2s infinite ease-in-out;
}
.sb-status .typing-dots span:nth-child(2){animation-delay:.15s;}
.sb-status .typing-dots span:nth-child(3){animation-delay:.3s;}
@keyframes tblink{0%,80%,100%{opacity:.25; transform:translateY(0);} 40%{opacity:1; transform:translateY(-2px);}}

/* ============ MESSAGES ============ */
#messages{
  flex:1;
  overflow-y:auto;
  padding:18px 14px 10px;
  display:flex;
  flex-direction:column;
  gap:3px;
  background:
    repeating-linear-gradient(0deg, transparent, transparent 27px, var(--line) 28px);
  background-size:100% 28px;
  background-attachment:local;
}
.day-sep{
  align-self:center;
  font-size:11px;
  color:var(--ink-soft);
  background:var(--paper-2);
  padding:4px 12px;
  border-radius:20px;
  margin:12px 0 8px;
  border:1px solid var(--line);
}

.msg-row{
  display:flex;
  gap:8px;
  max-width:86%;
  animation:msgIn .22s ease;
  position:relative;
}
@keyframes msgIn{
  from{opacity:0; transform:translateY(6px);}
  to{opacity:1; transform:translateY(0);}
}
.msg-row.mine{align-self:flex-end; flex-direction:row-reverse;}
.msg-row.theirs{align-self:flex-start;}

.bubble{
  position:relative;
  padding:9px 13px 7px;
  border-radius:var(--radius-bubble);
  font-size:14.5px;
  line-height:1.42;
  word-break:break-word;
  box-shadow:0 2px 6px rgba(0,0,0,0.08);
}
.msg-row.mine .bubble{
  background:var(--bubble-mine);
  color:var(--bubble-mine-text);
  border-bottom-right-radius:5px;
}
.msg-row.theirs .bubble{
  background:var(--bubble-theirs);
  color:var(--bubble-theirs-text);
  border-bottom-left-radius:5px;
}
/* dog-ear notebook corner fold, signature detail */
.bubble::after{
  content:"";
  position:absolute;
  top:0; width:10px; height:10px;
  background:rgba(0,0,0,0.10);
  clip-path:polygon(0 0, 100% 0, 100% 100%);
}
.msg-row.mine .bubble::after{ right:0; border-radius:0 0 0 6px;}
.msg-row.theirs .bubble::after{ left:0; clip-path:polygon(0 0, 100% 0, 0 100%); border-radius:0 0 6px 0;}

.bubble.giant-emoji{
  background:none !important;
  box-shadow:none !important;
  font-size:46px;
  padding:2px 4px;
  line-height:1.1;
}
.bubble.giant-emoji::after{display:none;}

.reply-quote{
  border-left:3px solid var(--thread);
  background:rgba(0,0,0,0.08);
  border-radius:8px;
  padding:5px 8px;
  margin-bottom:6px;
  font-size:12.5px;
  opacity:0.9;
}
.reply-quote .rq-name{font-weight:700; display:block; font-size:11.5px;}
.msg-row.theirs .reply-quote{background:rgba(0,0,0,0.05);}

.bubble .msg-media{
  display:block;
  max-width:230px;
  border-radius:12px;
  margin-bottom:4px;
  cursor:pointer;
}
.bubble video.msg-media{max-width:230px;}
.bubble audio.msg-media{width:220px; height:38px;}

.bubble .meta{
  display:flex;
  align-items:center;
  gap:4px;
  justify-content:flex-end;
  font-size:10.5px;
  opacity:0.75;
  margin-top:3px;
}
.bubble .ticks{display:flex; align-items:center;}
.bubble .ticks svg{width:15px;height:15px;}
.tick-read{color:var(--thread);}

.msg-actions{
  display:flex;
  flex-direction:column;
  justify-content:center;
  gap:4px;
  opacity:0;
  transition:opacity .15s ease;
}
.msg-row:hover .msg-actions{opacity:1;}
.msg-actions button{
  background:var(--paper-2);
  border:1px solid var(--line);
  border-radius:50%;
  width:28px;height:28px;
  display:flex;align-items:center;justify-content:center;
  color:var(--ink-soft);
}
.msg-actions button svg{width:14px;height:14px;}
.msg-actions button:hover{color:var(--ribbon); border-color:var(--ribbon);}

/* ============ COMPOSER ============ */
.reply-preview{
  display:none;
  align-items:center;
  gap:10px;
  padding:8px 14px;
  background:var(--paper-2);
  border-top:1px solid var(--line);
}
.reply-preview.active{display:flex;}
.reply-preview .rp-bar{width:3px; align-self:stretch; background:var(--thread); border-radius:2px;}
.reply-preview .rp-text{flex:1; font-size:13px; color:var(--ink-soft); min-width:0;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.reply-preview .rp-text b{color:var(--ink); display:block; font-size:12px;}
.reply-preview button{background:none;border:none;color:var(--ink-soft); width:26px;height:26px;}

#composer{
  flex-shrink:0;
  display:flex;
  align-items:flex-end;
  gap:8px;
  padding:10px 12px;
  background:var(--paper-2);
  border-top:1px solid var(--line);
}
#composer textarea{
  flex:1;
  resize:none;
  border:1px solid var(--line);
  background:var(--paper);
  color:var(--ink);
  border-radius:20px;
  padding:10px 16px;
  font-size:14.5px;
  font-family:inherit;
  max-height:110px;
  line-height:1.35;
}
.composer-btn{
  background:transparent;
  border:none;
  color:var(--ink-soft);
  width:40px;height:40px;
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
  transition:background .15s ease, color .15s ease;
}
.composer-btn:hover{background:var(--line); color:var(--ink);}
.composer-btn svg{width:21px;height:21px;}
#btn-send{
  background:var(--ribbon);
  color:#fff;
}
#btn-send:hover{background:var(--ribbon-2); color:#fff;}
#btn-mic.recording{
  background:var(--ribbon);
  color:#fff;
  animation:pulseRec 1s infinite;
}
@keyframes pulseRec{0%,100%{box-shadow:0 0 0 0 rgba(156,59,87,0.5);}50%{box-shadow:0 0 0 8px rgba(156,59,87,0);}}
.rec-timer{font-size:13px; color:var(--ribbon); align-self:center; min-width:38px;}

/* ============ MODALS ============ */
.modal-overlay{
  position:fixed; inset:0;
  background:rgba(20,15,10,0.7);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:100;
  padding:24px;
}
.modal-overlay.open{display:flex;}
.modal-card{
  background:var(--paper);
  border-radius:16px;
  padding:22px;
  max-width:320px;
  width:100%;
  box-shadow:var(--shadow);
  text-align:center;
}
.modal-card h3{
  font-family:var(--font-display);
  margin:0 0 8px;
  font-size:19px;
}
.modal-card p{color:var(--ink-soft); font-size:14px; margin:0 0 20px;}
.modal-actions{display:flex; gap:10px;}
.modal-actions button{
  flex:1;
  padding:11px;
  border-radius:12px;
  border:1px solid var(--line);
  background:var(--paper-2);
  color:var(--ink);
  font-size:14px;
  font-weight:600;
}
.modal-actions button.confirm{
  background:var(--ribbon);
  border-color:var(--ribbon);
  color:#fff;
}

#viewer-overlay{
  position:fixed; inset:0;
  background:rgba(0,0,0,0.92);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:200;
}
#viewer-overlay.open{display:flex;}
#viewer-overlay img{max-width:92vw; max-height:88vh; border-radius:6px;}
#viewer-close{
  position:absolute; top:18px; right:18px;
  background:rgba(255,255,255,0.12);
  border:none; color:#fff;
  width:40px;height:40px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
}

#toast{
  position:fixed;
  bottom:90px;
  left:50%;
  transform:translateX(-50%);
  background:var(--ink);
  color:var(--paper);
  padding:10px 18px;
  border-radius:20px;
  font-size:13px;
  opacity:0;
  pointer-events:none;
  transition:opacity .25s ease;
  z-index:150;
  max-width:80%;
  text-align:center;
}
#toast.show{opacity:0.95;}

/* scrollbar */
#messages::-webkit-scrollbar{width:6px;}
#messages::-webkit-scrollbar-thumb{background:var(--line); border-radius:3px;}

@media (prefers-reduced-motion: reduce){
  .msg-row, #btn-mic.recording{animation:none !important;}
}
</style>
</head>
<body>

<div id="app">

  <!-- ===================== ECRAN CHOIX PROFIL ===================== -->
  <div id="screen-profile">
    <div class="cover">
      <div class="cover-ribbon"></div>

      </button>
    </form>
  </div>
</div>

<!-- Modale confirmation générique -->
<div class="modal-overlay" id="modal-confirm">
  <div class="modal-card">
    <h3 id="modal-title">Confirmer</h3>
    <p id="modal-text">Es-tu sûr(e) ?</p>
    <div class="modal-actions">
      <button id="modal-cancel">Annuler</button>
      <button class="confirm" id="modal-confirm-btn">Supprimer</button>
    </div>
  </div>
</div>

<!-- Visionneuse plein écran -->
<div id="viewer-overlay">
  <button id="viewer-close">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><path d="M18 6 6 18M6 6l12 12"/></svg>
  </button>
  <img id="viewer-img" src="" alt="">
</div>

<div id="toast"></div>

function escapeHtml(str){
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function applyMarkdown(rawText){
  let t = escapeHtml(rawText);
  t = t.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  t = t.replace(/~~(.+?)~~/g, '<del>$1</del>');
  t = t.replace(/(?<!\*)\*(?!\*)(.+?)(?<!\*)\*(?!\*)/g, '<em>$1</em>');

  return t;
}
const EMOJI_RE = /^(?:\s*(?:\u00a9|\u00ae|[\u2000-\u3300]|\ud83c[\ud000-\udfff]|\ud83d[\ud000-\udfff]|\ud83e[\ud000-\udfff])\s*){1,6}$/u;
function isOnlyEmoji(text){
  if(!text || !text.trim()) return false;
  return EMOJI_RE.test(text.trim());
}
function showToast(msg){
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>t.classList.remove('show'), 2200);
}
function formatTime(date){
  if(!date) return '';
  return date.toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'});
}
function formatLastSeen(date){
  if(!date) return 'hors ligne';
  const today = new Date();
  const yest = new Date(); yest.setDate(today.getDate()-1);
  const sameDay = (a,b)=> a.toDateString() === b.toDateString();
  const hhmm = date.toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'});
  if(sameDay(date, today)) return `vu(e) à ${hhmm}`;
  if(sameDay(date, yest)) return `vu(e) hier à ${hhmm}`;
  return `vu(e) le ${date.toLocaleDateString('fr-FR',{day:'numeric',month:'short'})} à ${hhmm}`;
}

function formatDaySeparator(date){
  const today = new Date();
  const yest = new Date(); yest.setDate(today.getDate()-1);
  const sameDay = (a,b)=> a.toDateString() === b.toDateString();
  if(sameDay(date, today)) return "Aujourd'hui";
  if(sameDay(date, yest)) return "Hier";
  return date.toLocaleDateString('fr-FR', {day:'numeric', month:'long', year:'numeric'});
}

/* ========================================================================
   THEME — toujours sombre, pas de bascule
   ======================================================================== */

/* ========================================================================
   CHOIX / CHARGEMENT DU PROFIL
   ======================================================================== */
function startWithProfile(id){
  me = SECRET_PROFILES[id];
  other = SECRET_PROFILES[id === 'ida' ? 'aidara' : 'ida'];
  localStorage.setItem(PROFILE_STORAGE_KEY, id);

  $('#screen-profile').classList.add('hidden');
  $('#screen-chat').classList.add('active');

  attachListeners();
  initPresence();
}

document.querySelectorAll('.profile-btn').forEach(btn=>{
  btn.addEventListener('click', ()=> startWithProfile(btn.dataset.id));
});

(function autoResume(){
  const saved = localStorage.getItem(PROFILE_STORAGE_KEY);
  if(saved && SECRET_PROFILES[saved]) startWithProfile(saved);
})();

/* ========================================================================
   ECOUTE FIRESTORE — MESSAGES
   ======================================================================== */
function attachListeners(){
  if(unsubMessages) unsubMessages();
  if(unsubTyping) unsubTyping();

  unsubMessages = messagesRef.orderBy('createdAt', 'asc')
    .onSnapshot(snapshot=>{
      const msgs = [];
      snapshot.forEach(doc=> msgs.push({id: doc.id, ...doc.data()}));
      currentMessagesCache = msgs;
      renderMessages(msgs);
      markDeliveredAndMaybeRead(msgs);
    }, err=>{
      console.error(err);
      showToast("Connexion au carnet impossible (vérifie les règles Firestore).");
    });

  unsubTyping = typingRef.doc(other.id).onSnapshot(doc=>{
    const data = doc.data();
    otherIsTyping = !!(data && data.typing);
    renderStatus();
  });

  unsubPresence = presenceRef.doc(other.id).onSnapshot(doc=>{
    const data = doc.data();
    otherPresenceData = {
      online: !!(data && data.online),
      lastSeen: data && data.lastSeen && data.lastSeen.toDate ? data.lastSeen.toDate() : null
    };
    renderStatus();
  });
}

function isOtherActuallyOnline(){
  if(!otherPresenceData) return false;
  if(!otherPresenceData.online) return false;
  if(!otherPresenceData.lastSeen) return false;
  return (Date.now() - otherPresenceData.lastSeen.getTime()) < ONLINE_THRESHOLD_MS;
}

function renderStatus(){
  const statusEl = $('#other-status');
  if(!statusEl) return;
  if(otherIsTyping){
    statusEl.innerHTML = 'en train d\'écrire <span class="typing-dots"><span></span><span></span><span></span></span>';
  } else if(isOtherActuallyOnline()){
    statusEl.innerHTML = '<span class="dot-online"></span> en ligne';
  } else if(otherPresenceData && otherPresenceData.lastSeen){
    statusEl.textContent = formatLastSeen(otherPresenceData.lastSeen);
  } else {
    statusEl.innerHTML = '&nbsp;';
  }
}

/* ========================================================================
   PRESENCE (en ligne / hors ligne / vu à HH:mm)
   ======================================================================== */
function setMyPresence(online){
  if(!me) return;
  presenceRef.doc(me.id).set({
    online,
    lastSeen: firebase.firestore.FieldValue.serverTimestamp()
  }, {merge:true}).catch(()=>{});
}

function initPresence(){
  setMyPresence(true);
  clearInterval(heartbeatInterval);
  heartbeatInterval = setInterval(()=>{
    setMyPresence(document.visibilityState === 'visible');
  }, HEARTBEAT_MS);

  clearInterval(statusTickInterval);
  statusTickInterval = setInterval(renderStatus, 10000); // rafraîchit "vu à..." / bascule en ligne->hors ligne

  document.addEventListener('visibilitychange', ()=>{
    setMyPresence(document.visibilityState === 'visible');
  });
  window.addEventListener('beforeunload', ()=> setMyPresence(false));
  window.addEventListener('pagehide', ()=> setMyPresence(false));
}

/* ========================================================================
   RENDU DES MESSAGES
   ======================================================================== */
function renderMessages(msgs){
  const container = $('#messages');
  const wasAtBottom = (container.scrollTop + container.clientHeight) >= (container.scrollHeight - 60);
  container.innerHTML = '';

  let lastDay = null;
  msgs.forEach(m=>{
    const date = m.createdAt && m.createdAt.toDate ? m.createdAt.toDate() : new Date();
    const dayLabel = formatDaySeparator(date);
    if(dayLabel !== lastDay){
      const sep = document.createElement('div');
      sep.className = 'day-sep';
      sep.textContent = dayLabel;
      container.appendChild(sep);
      lastDay = dayLabel;
    }
    container.appendChild(buildMessageRow(m, date));
  });

  if(wasAtBottom || msgs.length <= 1){
    container.scrollTop = container.scrollHeight;
  }
}

function buildMessageRow(m, date){
  const isMine = m.senderId === me.id;
  const row = document.createElement('div');
  row.className = 'msg-row ' + (isMine ? 'mine' : 'theirs');
  row.dataset.id = m.id;

  const bubble = document.createElement('div');
  const giant = m.type === 'text' && isOnlyEmoji(m.text);
  bubble.className = 'bubble' + (giant ? ' giant-emoji' : '');

  let inner = '';

  if(m.replyTo){
    inner += `<div class="reply-quote"><span class="rq-name">${escapeHtml(m.replyTo.senderName||'')}</span>${escapeHtml((m.replyTo.text||'').slice(0,80))}</div>`;
  }

  if(m.type === 'image' && m.mediaUrl){
    inner += `<img class="msg-media" src="${m.mediaUrl}" alt="image" data-full="${m.mediaUrl}">`;
  } else if(m.type === 'video' && m.mediaUrl){
    inner += `<video class="msg-media" src="${m.mediaUrl}" controls></video>`;
  } else if(m.type === 'audio' && m.mediaUrl){
    inner += `<audio class="msg-media" src="${m.mediaUrl}" controls></audio>`;
  }

  if(m.type === 'text' && m.text){
    inner += giant ? escapeHtml(m.text) : `<div>${applyMarkdown(m.text)}</div>`;
  }

  let ticks = '';
  if(isMine){
    if(m.status === 'read'){
      ticks = `<span class="ticks tick-read"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M2 12l5 5L18 6"/><path d="M8 12l5 5L24 6"/></svg></span>`;
    } else if(m.status === 'delivered'){
      ticks = `<span class="ticks"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M2 12l5 5L18 6"/><path d="M8 12l5 5L24 6"/></svg></span>`;
    } else {
      ticks = `<span class="ticks"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 12l5 5L20 7"/></svg></span>`;
    }
  }

  if(!giant){
    inner += `<div class="meta"><span>${formatTime(date)}</span>${ticks}</div>`;
  }

  bubble.innerHTML = inner;

  const actions = document.createElement('div');
  actions.className = 'msg-actions';
  actions.innerHTML = `
    <button class="act-reply" title="Répondre">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 17l-5-5 5-5"/><path d="M4 12h11a4 4 0 0 1 4 4v1"/></svg>
    </button>
    <button class="act-delete" title="Supprimer">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6"/></svg>
    </button>`;

  actions.querySelector('.act-reply').addEventListener('click', ()=> setReplyTarget(m));
  actions.querySelector('.act-delete').addEventListener('click', ()=> confirmDeleteMessage(m.id));

  row.appendChild(bubble);
  row.appendChild(actions);

  // double-clic / clic droit -> suppression rapide
  bubble.addEventListener('dblclick', ()=> confirmDeleteMessage(m.id));
  bubble.addEventListener('contextmenu', (e)=>{ e.preventDefault(); confirmDeleteMessage(m.id); });

  // clic sur image -> plein écran
  const img = bubble.querySelector('img.msg-media');
  if(img){
    img.addEventListener('click', ()=>{
      $('#viewer-img').src = img.dataset.full;
      $('#viewer-overlay').classList.add('open');
    });
  }

  return row;
}

/* ========================================================================
   ACCUSES DE RECEPTION
   ======================================================================== */
function markDeliveredAndMaybeRead(msgs){
  const batchUpdates = [];
  msgs.forEach(m=>{
    if(m.senderId !== me.id){
      if(m.status === 'sent'){
        batchUpdates.push(messagesRef.doc(m.id).update({status:'delivered'}));
      }
      if(isWindowFocused && document.visibilityState === 'visible' && (m.status === 'sent' || m.status === 'delivered')){
        batchUpdates.push(messagesRef.doc(m.id).update({status:'read'}));
      }
    }
  });
  if(batchUpdates.length) Promise.all(batchUpdates).catch(console.error);
}

window.addEventListener('focus', ()=>{ isWindowFocused = true; markDeliveredAndMaybeRead(currentMessagesCache); });
window.addEventListener('blur', ()=>{ isWindowFocused = false; });
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState === 'visible') markDeliveredAndMaybeRead(currentMessagesCache);
});

/* ========================================================================
   ENVOI DE MESSAGES
   ======================================================================== */
async function sendMessage(data){
  const payload = Object.assign({
    senderId: me.id,
    status: 'sent',
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  }, data);
  if(replyingTo){
    payload.replyTo = {
      id: replyingTo.id,
      text: replyingTo.type === 'text' ? replyingTo.text : ('[' + replyingTo.type + ']'),
      senderName: SECRET_PROFILES[replyingTo.senderId] ? SECRET_PROFILES[replyingTo.senderId].name : ''
    };
  }
  clearReplyTarget();
  await messagesRef.add(payload);
}

const composer = $('#composer');
const textInput = $('#text-input');

composer.addEventListener('submit', async (e)=>{
  e.preventDefault();
  const text = textInput.value.trim();
  if(!text) return;
  textInput.value = '';
  autoResizeTextarea();
  setTypingState(false);
  try{
    await sendMessage({type:'text', text});
    scrollToBottomSoon();
  }catch(err){
    console.error(err);
    showToast("Envoi impossible — vérifie ta connexion / les règles Firestore.");
  }
});

function autoResizeTextarea(){
  textInput.style.height = 'auto';
  textInput.style.height = Math.min(textInput.scrollHeight, 110) + 'px';
}
textInput.addEventListener('input', ()=>{
  autoResizeTextarea();
  setTypingState(true);
  clearTimeout(typingTimeout);
  typingTimeout = setTimeout(()=> setTypingState(false), 1800);
});
textInput.addEventListener('keydown', (e)=>{
  if(e.key === 'Enter' && !e.shiftKey){
    e.preventDefault();
    composer.requestSubmit();
  }
});

function setTypingState(isTyping){
  typingRef.doc(me.id).set({
    typing: isTyping,
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  }).catch(()=>{});
}

function scrollToBottomSoon(){
  setTimeout(()=>{
    const c = $('#messages');
    c.scrollTop = c.scrollHeight;
  }, 60);
}

/* ========================================================================
   REPONDRE A UN MESSAGE
   ======================================================================== */
function setReplyTarget(m){
  replyingTo = m;
  const preview = $('#reply-preview');
  preview.classList.add('active');
  $('#rp-name').textContent = SECRET_PROFILES[m.senderId] ? SECRET_PROFILES[m.senderId].name : '';
  $('#rp-text').textContent = m.type === 'text' ? m.text : ('[' + m.type + ']');
  textInput.focus();
}
function clearReplyTarget(){
  replyingTo = null;
  $('#reply-preview').classList.remove('active');
}
$('#rp-cancel').addEventListener('click', clearReplyTarget);

/* ========================================================================
   SUPPRESSION D'UN MESSAGE / DE LA CONVERSATION
   ======================================================================== */
function openConfirmModal(title, text, onConfirm){
  $('#modal-title').textContent = title;
  $('#modal-text').textContent = text;
  pendingDeleteAction = onConfirm;
  $('#modal-confirm').classList.add('open');
}
$('#modal-cancel').addEventListener('click', ()=> $('#modal-confirm').classList.remove('open'));
$('#modal-confirm-btn').addEventListener('click', async ()=>{
  $('#modal-confirm').classList.remove('open');
  if(pendingDeleteAction) await pendingDeleteAction();
  pendingDeleteAction = null;
});

function confirmDeleteMessage(id){
  openConfirmModal('Supprimer ce message ?', 'Cette action est définitive pour vous deux.', async ()=>{
    try{ await messagesRef.doc(id).delete(); }
    catch(err){ console.error(err); showToast("Suppression impossible."); }
  });
}

function clearWholeConversation(){
  openConfirmModal('Effacer toute la conversation ?', 'Tous les messages de ce carnet seront supprimés définitivement.', async ()=>{
    try{
      const snap = await messagesRef.get();
      const batch = db.batch();
      snap.forEach(doc=> batch.delete(doc.ref));
      await batch.commit();
      showToast("Conversation effacée.");
    }catch(err){
      console.error(err);
      showToast("Suppression impossible.");
    }
  });
}

/* ========================================================================
   GESTE DISCRET : appui long sur la barre de statut = effacer la conversation
   (aucune icône visible, volontairement discret)
   ======================================================================== */
(function setupLongPressClear(){
  const bar = document.querySelector('.status-bar');
  if(!bar) return;
  let pressTimer = null;
  const start = ()=>{ pressTimer = setTimeout(clearWholeConversation, 900); };
  const cancel = ()=>{ clearTimeout(pressTimer); };
  bar.addEventListener('mousedown', start);
  bar.addEventListener('touchstart', start, {passive:true});
  ['mouseup','mouseleave','touchend','touchcancel'].forEach(ev=> bar.addEventListener(ev, cancel));
})();

/* ========================================================================
   VISIONNEUSE PLEIN ECRAN
   ======================================================================== */
$('#viewer-close').addEventListener('click', ()=> $('#viewer-overlay').classList.remove('open'));
$('#viewer-overlay').addEventListener('click', (e)=>{
  if(e.target.id === 'viewer-overlay') $('#viewer-overlay').classList.remove('open');
});

/* ========================================================================
   ENVOI DE FICHIERS (IMAGE / VIDEO) VIA SUPABASE STORAGE
   ======================================================================== */
$('#btn-attach').addEventListener('click', ()=> $('#file-input').click());
$('#file-input').addEventListener('change', async (e)=>{
  const file = e.target.files[0];
  e.target.value = '';
  if(!file) return;
  const type = file.type.startsWith('video') ? 'video' : 'image';
  showToast("Envoi en cours…");
  try{
    const path = `${type}s/${Date.now()}_${file.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`;
    const { error } = await supabaseClient.storage.from(SUPABASE_BUCKET).upload(path, file, {upsert:false});
    if(error) throw error;
    const { data } = supabaseClient.storage.from(SUPABASE_BUCKET).getPublicUrl(path);
    await sendMessage({type, mediaUrl: data.publicUrl});
    scrollToBottomSoon();
  }catch(err){
    console.error(err);
    showToast("Envoi du fichier impossible : " + (err && err.message ? err.message : "vérifie le bucket Supabase 'chat-media'."));
  }
});

/* ========================================================================
   NOTES VOCALES
   ======================================================================== */
const btnMic = $('#btn-mic');
btnMic.addEventListener('click', async ()=>{
  if(mediaRecorder && mediaRecorder.state === 'recording'){
    mediaRecorder.stop();
    return;
  }
  try{
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    recordedChunks = [];
    mediaRecorder = new MediaRecorder(stream);
    mediaRecorder.ondataavailable = (e)=>{ if(e.data.size>0) recordedChunks.push(e.data); };
    mediaRecorder.onstop = async ()=>{
      stream.getTracks().forEach(t=>t.stop());
      btnMic.classList.remove('recording');
      $('#rec-timer').style.display = 'none';
      clearInterval(recordTimerInterval);
      const blob = new Blob(recordedChunks, {type:'audio/webm'});
      if(blob.size < 500){ return; }
      showToast("Envoi de la note vocale…");
      try{
        const path = `audios/${Date.now()}_note.webm`;
        const { error } = await supabaseClient.storage.from(SUPABASE_BUCKET).upload(path, blob, {upsert:false, contentType:'audio/webm'});
        if(error) throw error;
        const { data } = supabaseClient.storage.from(SUPABASE_BUCKET).getPublicUrl(path);
        await sendMessage({type:'audio', mediaUrl: data.publicUrl});
        scrollToBottomSoon();
      }catch(err){
        console.error(err);
        showToast("Envoi de la note vocale impossible : " + (err && err.message ? err.message : ""));
      }
    };
    mediaRecorder.start();
    btnMic.classList.add('recording');
    recordStart = Date.now();
    $('#rec-timer').style.display = 'inline-block';
    recordTimerInterval = setInterval(()=>{
      const s = Math.floor((Date.now()-recordStart)/1000);
      const mm = Math.floor(s/60), ss = String(s%60).padStart(2,'0');
      $('#rec-timer').textContent = `${mm}:${ss}`;
    }, 250);
  }catch(err){
    console.error(err);
    showToast("Micro inaccessible — vérifie les permissions du navigateur.");
  }
});

})();
</script>

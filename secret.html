<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zone Privé</title>
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        /* ========== ROOT ========== */
        :root {
            --bg-main: #0a0a0a;
            --bg-chat: #0a0a0a;
            --text-main: #f5f5f5;
            --text-muted: #a8a8a8;
            --border-color: #262626;
            --bubble-received: #1e1e1e;
            --bubble-sent: linear-gradient(135deg, #6c00ff, #ff0080);
            --bubble-sent-text: #ffffff;
            --input-bg: #121212;
            --panel-bg: rgba(20, 20, 20, 0.95);
            --accent: #a800ff;
            --accent-glow: rgba(168, 0, 255, 0.3);
        }

        [data-theme="light"] {
            --bg-main: #ffffff;
            --bg-chat: #f0f2f5;
            --text-main: #000000;
            --text-muted: #737373;
            --border-color: #dbdbdb;
            --bubble-received: #ffffff;
            --bubble-sent: linear-gradient(135deg, #6c00ff, #ff0080);
            --input-bg: #ffffff;
            --panel-bg: rgba(255, 255, 255, 0.95);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg-main);
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* ========== HEADER ========== */
        .secret-header {
            background: linear-gradient(135deg, #1a0a2e, #2d1b69);
            padding: 10px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--accent);
            flex-shrink: 0;
            min-height: 56px;
        }

        .secret-header-left {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }

        .secret-header-left .lock-icon {
            color: #ffd700;
            font-size: 1.1rem;
            animation: lockPulse 2s ease infinite;
        }

        @keyframes lockPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); text-shadow: 0 0 20px rgba(255,215,0,0.3); }
        }

        .secret-header-title {
            color: white;
            font-weight: 700;
            font-size: 1rem;
        }

        .secret-header-subtitle {
            font-size: 0.6rem;
            color: rgba(255,255,255,0.4);
            letter-spacing: 0.5px;
        }

        .secret-header-actions {
            display: flex;
            gap: 14px;
            color: rgba(255,255,255,0.7);
            font-size: 1.1rem;
        }

        .secret-header-actions i {
            cursor: pointer;
            transition: all 0.3s;
        }

        .secret-header-actions i:hover {
            color: #ffd700;
            transform: scale(1.1);
        }

        /* ========== ZONE MESSAGES ========== */
        #secret-msg-area {
            flex: 1;
            overflow-y: auto;
            padding: 12px 14px;
            background: var(--bg-chat);
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        #secret-msg-area::-webkit-scrollbar {
            width: 3px;
        }

        #secret-msg-area::-webkit-scrollbar-thumb {
            background: var(--accent);
            border-radius: 10px;
        }

        /* ========== DATE ========== */
        .date-separator-secret {
            text-align: center;
            font-size: 0.65rem;
            color: var(--text-muted);
            font-weight: 600;
            margin: 8px 0 6px;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.5;
        }

        /* ========== MESSAGES ========== */
        .secret-message-row {
            display: flex;
            width: 100%;
            margin-bottom: 2px;
            animation: fadeMsg 0.2s ease-out;
        }

        @keyframes fadeMsg {
            from { opacity: 0; transform: translateY(6px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .secret-message-row.sent {
            justify-content: flex-end;
        }

        .secret-message-row.received {
            justify-content: flex-start;
        }

        .secret-message-bubble {
            max-width: 78%;
            padding: 9px 14px;
            border-radius: 18px;
            font-size: 0.9rem;
            line-height: 1.5;
            position: relative;
            word-wrap: break-word;
            word-break: break-word;
            min-width: 50px;
            transition: all 0.2s;
            cursor: default;
        }

        .secret-message-row.sent .secret-message-bubble {
            background: var(--bubble-sent);
            color: var(--bubble-sent-text);
            border-bottom-right-radius: 4px;
        }

        .secret-message-row.received .secret-message-bubble {
            background: var(--bubble-received);
            color: var(--text-main);
            border-bottom-left-radius: 4px;
            border: 1px solid var(--border-color);
        }

        .secret-message-bubble.giant-emoji {
            background: transparent !important;
            padding: 0 !important;
            font-size: 3.5rem !important;
            box-shadow: none !important;
            border: none !important;
        }

        .secret-message-bubble.deleted {
            opacity: 0.5;
            font-style: italic;
        }

        /* ========== META ========== */
        .secret-msg-meta {
            font-size: 0.6rem;
            opacity: 0.6;
            margin-top: 3px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 3px;
        }

        .secret-message-row.sent .secret-msg-meta {
            color: rgba(255,255,255,0.7);
        }

        .secret-message-row.received .secret-msg-meta {
            color: var(--text-muted);
        }

        .status-tick-secret {
            margin-left: 2px;
        }

        .status-tick-secret.read {
            color: #53bdeb;
        }

        .status-tick-secret.delivered {
            color: #8696a0;
        }

        .status-tick-secret.sent {
            color: #8696a0;
        }

        /* ========== RÉPONSE ========== */
        .reply-citation-secret {
            font-size: 0.75rem;
            background: rgba(0,0,0,0.08);
            padding: 4px 8px;
            border-left: 3px solid var(--accent);
            border-radius: 4px;
            margin-bottom: 4px;
            opacity: 0.7;
        }

        [data-theme="light"] .reply-citation-secret {
            background: rgba(0,0,0,0.05);
        }

        /* ========== TYPING ========== */
        #typing-ind-secret {
            display: none;
            align-items: center;
            gap: 8px;
            padding: 4px 16px;
            font-size: 0.75rem;
            color: var(--text-muted);
            flex-shrink: 0;
        }

        .typing-dots-secret {
            display: flex;
            gap: 3px;
        }

        .typing-dots-secret span {
            width: 6px;
            height: 6px;
            background: var(--text-muted);
            border-radius: 50%;
            animation: bounceDot 1.4s infinite ease-in-out both;
        }

        .typing-dots-secret span:nth-child(1) { animation-delay: -0.32s; }
        .typing-dots-secret span:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounceDot {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        /* ========== REPLY BAR ========== */
        #reply-preview-secret {
            display: none;
            padding: 6px 16px;
            background: var(--input-bg);
            border-top: 1px solid var(--border-color);
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            color: var(--text-muted);
            flex-shrink: 0;
        }

        #reply-preview-secret span {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        #reply-preview-secret i {
            cursor: pointer;
            padding: 4px 8px;
            transition: all 0.2s;
        }

        #reply-preview-secret i:hover {
            color: #ff4444;
            transform: scale(1.1);
        }

        /* ========== INPUT BAR ========== */
        .secret-input-bar {
            padding: 8px 12px 12px;
            background: var(--bg-main);
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 8px;
            align-items: flex-end;
            flex-shrink: 0;
        }

        .secret-input-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 2px 10px 2px 14px;
            transition: all 0.3s;
        }

        .secret-input-wrapper:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .secret-input {
            flex: 1;
            background: transparent;
            border: none;
            padding: 8px 4px;
            font-size: 0.92rem;
            color: var(--text-main);
            outline: none;
            resize: none;
            max-height: 100px;
            min-height: 36px;
            line-height: 1.4;
            font-family: 'Inter', sans-serif;
        }

        .secret-input::placeholder {
            color: var(--text-muted);
            opacity: 0.5;
        }

        .secret-input-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .secret-input-actions i {
            cursor: pointer;
            transition: all 0.2s;
        }

        .secret-input-actions i:hover {
            color: var(--accent);
            transform: scale(1.1);
        }

        .secret-send-btn {
            background: linear-gradient(135deg, var(--accent), #ff0080);
            border: none;
            border-radius: 50%;
            width: 42px;
            height: 42px;
            color: white;
            cursor: pointer;
            font-size: 1.1rem;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            box-shadow: 0 2px 12px var(--accent-glow);
        }

        .secret-send-btn:hover {
            transform: scale(1.05);
        }

        .secret-send-btn:active {
            transform: scale(0.95);
        }

        .secret-send-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        /* ========== PANNEAUX ========== */
        .floating-panel {
            display: none;
            position: absolute;
            bottom: 75px;
            left: 12px;
            right: 12px;
            background: var(--panel-bg);
            backdrop-filter: blur(15px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 12px;
            z-index: 50;
            box-shadow: 0 8px 30px rgba(0,0,0,0.4);
        }

        .floating-panel .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .floating-panel .panel-header h4 {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .floating-panel .panel-header i {
            cursor: pointer;
            padding: 4px;
            color: var(--text-muted);
        }

        .floating-panel .panel-header i:hover {
            color: #ff4444;
        }

        /* ========== EMOJI GRID ========== */
        .emoji-grid-secret {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 10px;
            font-size: 1.6rem;
            text-align: center;
        }

        .emoji-grid-secret span {
            cursor: pointer;
            transition: all 0.2s;
            padding: 4px;
            border-radius: 8px;
        }

        .emoji-grid-secret span:hover {
            transform: scale(1.3);
            background: var(--accent-glow);
        }

        /* ========== TOOLS ========== */
        .tools-grid-secret {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            text-align: center;
        }

        .tool-item-secret {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 10px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            background: var(--input-bg);
            border: 1px solid transparent;
        }

        .tool-item-secret:hover {
            background: rgba(168, 0, 255, 0.15);
            border-color: var(--accent);
            transform: scale(1.05);
        }

        .tool-item-secret i {
            font-size: 1.6rem;
        }

        .tool-item-secret span {
            font-size: 0.65rem;
            color: var(--text-muted);
        }

        /* ========== AUDIO ========== */
        .audio-player-container {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0,0,0,0.08);
            padding: 4px 10px;
            border-radius: 20px;
            min-width: 160px;
        }

        [data-theme="light"] .audio-player-container {
            background: rgba(0,0,0,0.05);
        }

        .audio-play-btn {
            background: none;
            border: none;
            font-size: 1rem;
            cursor: pointer;
            color: var(--accent);
            padding: 4px;
        }

        .audio-progress-bar {
            flex: 1;
            height: 3px;
            background: rgba(0,0,0,0.15);
            border-radius: 3px;
            overflow: hidden;
            cursor: pointer;
        }

        .audio-progress-fill {
            height: 100%;
            background: var(--accent);
            width: 0%;
            transition: width 0.1s;
        }

        .audio-time {
            font-size: 0.6rem;
            color: var(--text-muted);
            min-width: 32px;
        }

        /* ========== VIDEO / IMAGE ========== */
        .media-preview {
            max-width: 200px;
            border-radius: 12px;
            margin-top: 4px;
            cursor: pointer;
        }

        .video-wrapper {
            max-width: 220px;
            border-radius: 12px;
            overflow: hidden;
            background: #000;
            margin-top: 4px;
        }

        .video-wrapper video {
            width: 100%;
            display: block;
        }

        /* ========== EMPTY STATE ========== */
        .secret-empty-state {
            text-align: center;
            color: var(--text-muted);
            padding: 50px 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .secret-empty-state .big-icon {
            font-size: 3.5rem;
            animation: floatLock 4s ease-in-out infinite;
        }

        @keyframes floatLock {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        .secret-empty-state h3 {
            color: var(--text-main);
            font-weight: 600;
        }

        /* ========== MODAL ========== */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            animation: fadeModal 0.3s ease;
        }

        @keyframes fadeModal {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-box {
            background: var(--bg-main);
            border-radius: 20px;
            padding: 28px 24px;
            max-width: 320px;
            width: 90%;
            border: 1px solid var(--border-color);
            text-align: center;
        }

        .modal-box .modal-icon {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .modal-box h3 {
            font-size: 1rem;
            margin-bottom: 6px;
        }

        .modal-box p {
            font-size: 0.82rem;
            color: var(--text-muted);
            margin-bottom: 18px;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .modal-btn {
            padding: 8px 20px;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .modal-btn.cancel {
            background: var(--border-color);
            color: var(--text-main);
        }

        .modal-btn.danger {
            background: #ff4444;
            color: white;
        }

        .modal-btn.confirm {
            background: var(--accent);
            color: white;
        }

        /* ========== SÉLECTEUR DE PROFIL ========== */
        .profile-picker-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(135deg, #0a0a0a, #1a0a2e);
            z-index: 5000;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 28px;
            padding: 20px;
            text-align: center;
        }

        .profile-picker-title {
            color: white;
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .profile-picker-subtitle {
            color: rgba(255,255,255,0.5);
            font-size: 0.85rem;
            margin-bottom: 10px;
        }

        .profile-picker-choices {
            display: flex;
            gap: 18px;
        }

        .profile-choice-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 20px;
            padding: 22px 28px;
            cursor: pointer;
            transition: all 0.25s;
            min-width: 120px;
        }

        .profile-choice-btn:active {
            transform: scale(0.95);
        }

        .profile-choice-btn:hover {
            background: var(--accent-glow);
            border-color: var(--accent);
        }

        .profile-choice-avatar {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: 700;
            color: white;
            background: linear-gradient(135deg, #6c00ff, #ff0080);
        }

        .profile-choice-name {
            color: white;
            font-weight: 600;
            font-size: 0.95rem;
        }

        /* ========== VISIONNEUSE IMAGE PLEIN ÉCRAN ========== */
        .image-fullscreen-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 4000;
            justify-content: center;
            align-items: center;
            animation: fadeModal 0.2s ease;
        }

        .image-fullscreen-overlay img {
            max-width: 94%;
            max-height: 88%;
            object-fit: contain;
            border-radius: 6px;
        }

        .image-fullscreen-close {
            position: absolute;
            top: 18px;
            right: 20px;
            color: white;
            font-size: 1.6rem;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255,255,255,0.1);
            border-radius: 50%;
            cursor: pointer;
        }

        /* ========== TOAST ========== */
        .toast-notification {
            position: fixed;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(10px);
            color: white;
            padding: 8px 18px;
            border-radius: 14px;
            font-size: 0.82rem;
            z-index: 2000;
            border: 1px solid rgba(255,255,255,0.05);
            box-shadow: 0 8px 30px rgba(0,0,0,0.4);
            animation: toastAnim 2.5s ease forwards;
            pointer-events: none;
            max-width: 85%;
        }

        @keyframes toastAnim {
            0% { opacity: 0; transform: translateX(-50%) translateY(15px); }
            15% { opacity: 1; transform: translateX(-50%) translateY(0); }
            85% { opacity: 1; }
            100% { opacity: 0; transform: translateX(-50%) translateY(-10px); }
        }

        /* ========== RESPONSIVE ========== */
        @media(max-width: 480px) {
            .secret-header-title { font-size: 0.9rem; }
            .secret-message-bubble { font-size: 0.85rem; padding: 8px 12px; }
            .secret-send-btn { width: 38px; height: 38px; font-size: 1rem; }
            .emoji-grid-secret { gap: 6px; font-size: 1.4rem; }
        }
    </style>
</head>
<body>

    <!-- SÉLECTEUR DE PROFIL -->
    <div class="profile-picker-overlay" id="profile-picker-overlay">
        <div class="profile-picker-title">Zone Privé</div>
        <div class="profile-picker-subtitle">Je suis</div>
        <div class="profile-picker-choices">
            <div class="profile-choice-btn" onclick="chooseProfileSecret('ida')">
                <div class="profile-choice-avatar">I</div>
                <div class="profile-choice-name">Ida</div>
            </div>
            <div class="profile-choice-btn" onclick="chooseProfileSecret('aidara')">
                <div class="profile-choice-avatar">A</div>
                <div class="profile-choice-name">Aidara</div>
            </div>
        </div>
    </div>

    <!-- VISIONNEUSE IMAGE PLEIN ÉCRAN -->
    <div class="image-fullscreen-overlay" id="image-fullscreen-overlay" onclick="closeImageFullscreenSecret()">
        <div class="image-fullscreen-close" onclick="closeImageFullscreenSecret()"><i class="fa-solid fa-xmark"></i></div>
        <img id="image-fullscreen-img" src="" alt="">
    </div>

    <!-- HEADER -->
    <div class="secret-header">
        <div class="secret-header-left">
            <span class="lock-icon"><i class="fa-solid fa-lock"></i></span>
            <div>
                <div class="secret-header-title">Privé</div>
                <div class="secret-header-subtitle">🔒 Conversation sécurisé</div>
            </div>
        </div>
        <div class="secret-header-actions">
            
            
        </div>
    </div>

    <!-- MESSAGES -->
    <div id="secret-msg-area"></div>

    <!-- TYPING -->
    <div id="typing-ind-secret">
        <div class="typing-dots-secret"><span></span><span></span><span></span></div>
        <span id="typing-txt-secret">Quelqu'un écrit...</span>
    </div>

    <!-- REPLY PREVIEW -->
    <div id="reply-preview-secret">
        <span id="reply-preview-text-secret">Réponse à un message...</span>

    <script>
        // ========== FIREBASE ==========
        const firebaseConfig = {
            apiKey: "AIzaSyDGC2LQYeSrlb6MRwtLlQGDzz-yJHtKf8c",
            authDomain: "messagerie-65abc.firebaseapp.com",
            projectId: "messagerie-65abc",
            storageBucket: "messagerie-65abc.firebasestorage.app",
            messagingSenderId: "363641716532",
            appId: "1:363641716532:web:d16bd3b4eaf4abf4e8ef61"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const storage = firebase.storage();

        // ========== SUPABASE ==========
        const SUPABASE_URL = "https://noilukehswntfgcsusoe.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5vaWx1a2Voc3dudGZnY3N1c29lIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEzNzQwOTEsImV4cCI6MjA5Njk1MDA5MX0.y2_dGvo_SrLaozd5zkLe4PFXSY1kSW0DKY5kNv2Keds";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // ========== CONSTANTES ==========
        const SECRET_CHAT_ID = "secret_carnet_ida_aidara";

        // ========== PROFILS FIXES : IDA / AIDARA ==========
        const SECRET_PROFILES = {
            ida: { id: 'ida', name: 'Ida' },
            aidara: { id: 'aidara', name: 'Aidara' }
        };
        const PROFILE_STORAGE_KEY = 'secret_profile_choice';

        let currentUser = null;
        let targetUser = null;

        function getSavedProfileKey() {
            try {
                return localStorage.getItem(PROFILE_STORAGE_KEY);
            } catch(e) {
                return null;
            }
        }

        function chooseProfileSecret(key) {
            if (!SECRET_PROFILES[key]) return;
            try {
                localStorage.setItem(PROFILE_STORAGE_KEY, key);
            } catch(e) {}
            document.getElementById('profile-picker-overlay').style.display = 'none';
            startSecretApp(key);
        }

        function switchProfileSecret() {
            document.getElementById('profile-picker-overlay').style.display = 'flex';
        }

        // ========== VARIABLES D'ÉTAT ==========
        let secretMessagesUnsubscribe = null;
        let secretTypingUnsubscribe = null;
        let typingTimeoutSecret = null;
        let replyToIdSecret = null;
        let mediaRecorderSecret = null;
        let audioChunksSecret = [];
        let isFirstLoad = true;
        let secretAppStarted = false;

        function startSecretApp(key) {
            currentUser = SECRET_PROFILES[key];
            targetUser = key === 'ida' ? SECRET_PROFILES.aidara : SECRET_PROFILES.ida;

            if (secretAppStarted) {
                // On change juste de profil : on ré-affiche les messages avec le bon point de vue
                listenToSecretMessages();
                listenToTypingSecret();
                return;
            }
            secretAppStarted = true;

            loadThemeSecret();
            listenToSecretMessages();
            listenToTypingSecret();
            setupInputEvents();

            setTimeout(() => {
                document.getElementById('secret-input').focus();
            }, 300);

            // Message de bienvenue si premier chargement
            const msgArea = document.getElementById('secret-msg-area');
            if (msgArea.children.length === 0) {
                msgArea.innerHTML = `
                    <div class="secret-empty-state">
                        <div class="big-icon">🔒</div>
                        <h3>Bienvenue dans votre Carnet Secret</h3>
                        <p>Vos messages sont privés et sécurisés.</p>
                        <p style="font-size:0.75rem; opacity:0.4;">💬 Envoyez votre premier message</p>
                    </div>
                `;
            }
        }

        // ========== INIT ==========
        document.addEventListener('DOMContentLoaded', function() {
            const savedKey = getSavedProfileKey();
            if (savedKey && SECRET_PROFILES[savedKey]) {
                startSecretApp(savedKey);
            } else {
                document.getElementById('profile-picker-overlay').style.display = 'flex';
            }
        });

        // ========== THÈME ==========
        function toggleThemeSecret() {
            const current = document.documentElement.getAttribute('data-theme');
            const target = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', target);
            localStorage.setItem('theme_secret', target);
            updateThemeIconSecret();
        }

        function loadThemeSecret() {
            const saved = localStorage.getItem('theme_secret') || 'dark';
            document.documentElement.setAttribute('data-theme', saved);
            updateThemeIconSecret();
        }

        function updateThemeIconSecret() {
            const icon = document.getElementById('theme-icon-secret');
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            icon.className = isDark ? 'fa-solid fa-moon' : 'fa-solid fa-sun';
        }

        // ========== PANNEAUX ==========
        function togglePanelSecret(type) {
            const emojiPanel = document.getElementById('emoji-panel-secret');
            const toolsPanel = document.getElementById('tools-panel-secret');
            
            if (type === 'emoji') {
                const isOpen = emojiPanel.style.display === 'block';
                emojiPanel.style.display = isOpen ? 'none' : 'block';
                toolsPanel.style.display = 'none';
            } else if (type === 'tools') {
                const isOpen = toolsPanel.style.display === 'block';
                toolsPanel.style.display = isOpen ? 'none' : 'block';
                emojiPanel.style.display = 'none';
            }
        }

        function closePanelSecret(type) {
            if (type === 'emoji') {
                document.getElementById('emoji-panel-secret').style.display = 'none';
            } else if (type === 'tools') {
                document.getElementById('tools-panel-secret').style.display = 'none';
            }
        }

        // Fermer les panels au clic extérieur
        document.addEventListener('click', function(e) {
            const emojiPanel = document.getElementById('emoji-panel-secret');
            const toolsPanel = document.getElementById('tools-panel-secret');
            const emojiBtn = document.querySelector('.fa-face-smile');
            const toolsBtn = document.querySelector('.fa-paperclip');
            
            if (emojiPanel && emojiPanel.style.display === 'block' && !emojiPanel.contains(e.target) && e.target !== emojiBtn) {
                emojiPanel.style.display = 'none';
            }
            if (toolsPanel && toolsPanel.style.display === 'block' && !toolsPanel.contains(e.target) && e.target !== toolsBtn) {
                toolsPanel.style.display = 'none';
            }
        });

        // ========== ÉMOJIS ==========
        function insertEmojiSecret(emoji) {
            const input = document.getElementById('secret-input');
            const start = input.selectionStart;
            const end = input.selectionEnd;
            const text = input.value;
            input.value = text.substring(0, start) + emoji + text.substring(end);
            input.focus();
            input.selectionStart = input.selectionEnd = start + emoji.length;
            handleTypingSecret();
            document.getElementById('emoji-panel-secret').style.display = 'none';
        }

        // ========== UPLOAD VERS SUPABASE ==========
        async function uploadToSupabase(file, type) {
            const fileExt = file.name.split('.').pop();
            const fileName = `secret_${currentUser.id}_${Date.now()}.${fileExt}`;
            
            try {
                const { data, error } = await supabaseClient.storage
                    .from('chat_media')
                    .upload(fileName, file, {
                        cacheControl: '3600',
                        contentType: file.type,
                        upsert: true
                    });
                
                if (error) {
                    console.error("Erreur upload:", error);
                    return null;
                }
                
                const { data: urlData } = supabaseClient.storage
                    .from('chat_media')
                    .getPublicUrl(fileName);
                
                return urlData.publicUrl;
            } catch(e) {
                console.error("Exception upload:", e);
                return null;
            }
        }

        // ========== ENVOI DE MÉDIAS ==========
        function triggerImageUploadSecret() {
            document.getElementById('file-input-secret').click();
        }

        function triggerCameraSecret() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/*';
            input.capture = 'environment';
            input.onchange = function(e) {
                if (e.target.files && e.target.files[0]) {
                    handleFileUploadSecret(e.target);
                }
            };
            input.click();
        }

        async function handleFileUploadSecret(input) {
            if (!input.files || !input.files[0]) return;
            
            const file = input.files[0];
            const type = file.type.startsWith('image/') ? 'image' : 'video';
            
            showToastSecret(`📤 Upload ${type}...`);
            
            const url = await uploadToSupabase(file, type);
            
            if (url) {
                const msgData = {
                    text: null,
                    senderId: currentUser.id,
                    senderName: currentUser.name,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                    status: "sent",
                    readBy: [currentUser.id],
                    type: type,
                    mediaUrl: url,
                    storage: 'supabase'
                };
                
                if (replyToIdSecret) {
                    msgData.replyToId = replyToIdSecret;
                    msgData.replyToText = getReplyTextSecret();
                    msgData.replyToSender = currentUser.name;
                }
                
                await db.collection('secret_chats').doc(SECRET_CHAT_ID).collection('messages').add(msgData);
                showToastSecret(type === 'image' ? '📷 Photo envoyée' : '🎥 Vidéo envoyée');
                cancelReplySecret();
            } else {
                showToastSecret('❌ Erreur upload');
            }
            
            input.value = '';
        }

        // ========== AUDIO ==========
        async function toggleRecordingSecret() {
            const micBtn = document.getElementById('mic-btn-secret');
            
            if (!mediaRecorderSecret || mediaRecorderSecret.state === 'inactive') {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorderSecret = new MediaRecorder(stream);
                    audioChunksSecret = [];
                    
                    mediaRecorderSecret.ondataavailable = e => audioChunksSecret.push(e.data);
                    mediaRecorderSecret.onstop = async () => {
                        const audioBlob = new Blob(audioChunksSecret, { type: 'audio/webm' });
                        const file = new File([audioBlob], `audio_${currentUser.id}_${Date.now()}.webm`, { type: 'audio/webm' });
                        
                        const url = await uploadToSupabase(file, 'audio');
                        
                        if (url) {
                            const msgData = {
                                text: null,
                                senderId: currentUser.id,
                                senderName: currentUser.name,
                                timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                                status: "sent",
                                readBy: [currentUser.id],
                                type: "audio",
                                mediaUrl: url,
                                storage: 'supabase'
                            };
                            
                            if (replyToIdSecret) {
                                msgData.replyToId = replyToIdSecret;
                                msgData.replyToText = getReplyTextSecret();
                                msgData.replyToSender = currentUser.name;
                            }
                            
                            await db.collection('secret_chats').doc(SECRET_CHAT_ID).collection('messages').add(msgData);
                            showToastSecret('🎙️ Audio envoyé');
                            cancelReplySecret();
                        } else {
                            showToastSecret('❌ Erreur audio');
                        }
                    };
                    
                    mediaRecorderSecret.start();
                    micBtn.className = 'fa-solid fa-circle-stop';
                    micBtn.style.color = '#ff4444';
                    showToastSecret('🎤 Enregistrement...');
                    
                    setTimeout(() => {
                        if (mediaRecorderSecret && mediaRecorderSecret.state === 'recording') {
                            toggleRecordingSecret();
                        }
                    }, 30000);
                    
                } catch(err) {
                    showToastSecret('❌ Accès micro refusé');
                }
            } else {
                mediaRecorderSecret.stop();
                micBtn.className = 'fa-solid fa-microphone';
                micBtn.style.color = '';
                showToastSecret('⏹️ Enregistrement terminé');
            }
        }

        // ========== ENVOYER UN MESSAGE TEXTE ==========
        async function sendSecretMessage() {
            const input = document.getElementById('secret-input');
            let text = input.value.trim();
            
            if (!text) return;

            const sendBtn = document.getElementById('secret-send-btn');
            sendBtn.disabled = true;

            const msgData = {
                text: text,
                senderId: currentUser.id,
                senderName: currentUser.name,
                timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                status: "sent",
                readBy: [currentUser.id],
                type: "text"
            };

            if (replyToIdSecret) {
                msgData.replyToId = replyToIdSecret;
                msgData.replyToText = getReplyTextSecret();
                msgData.replyToSender = currentUser.name;
            }

            input.value = '';
            autoResizeSecret();
            handleTypingSecret();

            try {
                await db.collection('secret_chats').doc(SECRET_CHAT_ID).collection('messages').add(msgData);
                cancelReplySecret();
            } catch(error) {
                console.error("Erreur envoi:", error);
                showToastSecret('❌ Erreur d\'envoi');
                input.value = text;
            }

            sendBtn.disabled = false;
            input.focus();
        }

        // ========== RÉPONDRE ==========
        function initiateReplySecret(messageId) {
            replyToIdSecret = messageId;
            const row = document.querySelector(`[data-id="${messageId}"]`);
            if (row) {
                const bubble = row.querySelector('.secret-message-bubble');
                const text = bubble ? bubble.innerText.trim().substring(0, 60) : 'Message';
                document.getElementById('reply-preview-text-secret').innerText = `Réponse à : ${text}...`;
                document.getElementById('reply-preview-secret').style.display = 'flex';
                document.getElementById('secret-input').focus();
            }
        }

        function cancelReplySecret() {
            replyToIdSecret = null;
            document.getElementById('reply-preview-secret').style.display = 'none';
        }

        function getReplyTextSecret() {
            const row = document.querySelector(`[data-id="${replyToIdSecret}"]`);
            if (row) {
                const bubble = row.querySelector('.secret-message-bubble');
                return bubble ? bubble.innerText.trim().substring(0, 100) : 'Message';
            }
            return 'Message';
        }

        // ========== SUPPRIMER UN MESSAGE ==========
        async function deleteMessageSecret(messageId) {
            if (!messageId) return;
            if (!confirm('Supprimer ce message ?')) return;
            
            try {
                await db.collection('secret_chats').doc(SECRET_CHAT_ID).collection('messages').doc(messageId).update({
                    isDeleted: true,
                    text: "🚫 Message supprimé",
                    deletedAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                showToastSecret('🗑️ Message supprimé');
            } catch(error) {
                showToastSecret('❌ Erreur suppression');
            }
        }

        // ========== SUPPRESSION TOTALE ==========
        function openDeleteModal() {
            document.getElementById('modal-delete-secret').style.display = 'flex';
        }

        function closeDeleteModal() {
            document.getElementById('modal-delete-secret').style.display = 'none';
        }

        async function confirmDeleteAll() {
            closeDeleteModal();
            try {
                const snapshot = await db.collection('secret_chats').doc(SECRET_CHAT_ID).collection('messages').get();
                const batch = db.batch();
                snapshot.docs.forEach(doc => batch.delete(doc.ref));
                await batch.commit();
                showToastSecret('🗑️ Tous les messages supprimés');
            } catch(error) {
                showToastSecret('❌ Erreur suppression');
            }
        }

        // ========== RAFRAÎCHIR ==========
        function refreshMessages() {
            showToastSecret('🔄 Rafraîchissement...');
            if (secretMessagesUnsubscribe) {
                secretMessagesUnsubscribe();
                secretMessagesUnsubscribe = null;
            }
            setTimeout(() => {
                listenToSecretMessages();
                showToastSecret('✅ Actualisé');
            }, 300);
        }

        // ========== ÉCOUTE DES MESSAGES ==========
        function listenToSecretMessages() {
            if (secretMessagesUnsubscribe) {
                secretMessagesUnsubscribe();
                secretMessagesUnsubscribe = null;
            }

            const msgArea = document.getElementById('secret-msg-area');
            
            secretMessagesUnsubscribe = db.collection('secret_chats').doc(SECRET_CHAT_ID).collection('messages')
                .orderBy('timestamp', 'asc')
                .limitToLast(200)
                .onSnapshot(snapshot => {
                    if (snapshot.empty) {
                        msgArea.innerHTML = `
                            <div class="secret-empty-state">
                                <div class="big-icon">🔒</div>
                                <h3>Confidentiel</h3>
                                <p> </p>
                                <p style="font-size:0.75rem; opacity:0.4;">💬 Envoyez votre premier message</p>
                            </div>
                        `;
                        return;
                    }

                    // Garder les éléments existants pour une mise à jour intelligente
                    const existingRows = msgArea.querySelectorAll('.secret-message-row, .date-separator-secret');
                    existingRows.forEach(el => el.remove());

                    let lastDateStr = "";
                    let messages = [];

                    snapshot.forEach(doc => {
                        const data = doc.data();
                        data._id = doc.id;
                        messages.push(data);
                    });

                    messages.forEach((data) => {
                        if (data.timestamp) {
                            const dateObj = data.timestamp.toDate ? data.timestamp.toDate() : new Date(data.timestamp);
                            const dateStr = dateObj.toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' });
                            if (dateStr !== lastDateStr) {
                                const sep = document.createElement('div');
                                sep.className = 'date-separator-secret';
                                sep.innerText = dateStr;
                                msgArea.appendChild(sep);
                                lastDateStr = dateStr;
                            }
                        }

                        const row = document.createElement('div');
                        const isSent = data.senderId === currentUser.id;
                        row.className = `secret-message-row ${isSent ? 'sent' : 'received'}`;
                        row.setAttribute('data-id', data._id);

                        const isGiant = isOnlyEmojisSecret(data.text);
                        const isDeleted = data.isDeleted === true;
                        const isMedia = data.type === 'image' || data.type === 'video' || data.type === 'audio';

                        let bubbleHtml = `<div class="secret-message-bubble ${isGiant ? 'giant-emoji' : ''} ${isDeleted ? 'deleted' : ''}" 
                            oncontextmenu="event.preventDefault(); if('${isSent}' === 'true' && !${isDeleted}) deleteMessageSecret('${data._id}');"
                            ondblclick="if('${isSent}' === 'true' && !${isDeleted}) deleteMessageSecret('${data._id}');">`;

                        // Réponse à un message
                        if (data.replyToText) {
                            bubbleHtml += `<div class="reply-citation-secret"><b>${escapeHTMLSecret(data.replyToSender || '')}:</b> ${escapeHTMLSecret(data.replyToText)}</div>`;
                        }

                        // Contenu du message
                        if (isDeleted) {
                            bubbleHtml += `<span style="font-style:italic;">🚫 Message supprimé</span>`;
                        } else if (data.type === 'image') {
                            bubbleHtml += `<img src="${data.mediaUrl}" class="media-preview" onclick="openImageFullscreenSecret('${data.mediaUrl}', event)" />`;
                        } else if (data.type === 'video') {
                            bubbleHtml += `
                                <div class="video-wrapper">
                                    <video src="${data.mediaUrl}" controls playsinline preload="metadata"></video>
                                </div>
                            `;
                        } else if (data.type === 'audio') {
                            bubbleHtml += `
                                <div class="audio-player-container">
                                    <button class="audio-play-btn" onclick="toggleAudioSecret(this)"><i class="fa-solid fa-play"></i></button>
                                    <div class="audio-progress-bar" onclick="seekAudioSecret(this, event)">
                                        <div class="audio-progress-fill"></div>
                                    </div>
                                    <span class="audio-time">0:00</span>
                                    <audio src="${data.mediaUrl}" preload="metadata" style="display:none;"></audio>
                                </div>
                            `;
                        } else {
                            const displayText = formatTextSecret(escapeHTMLSecret(data.text || ''));
                            bubbleHtml += `<span style="white-space:pre-wrap; display:block;">${displayText}</span>`;
                        }

                        // Meta (heure + statut)
                        const timeStr = data.timestamp ? 
                            (data.timestamp.toDate ? data.timestamp.toDate().toLocaleTimeString('fr-FR', {hour: '2-digit', minute:'2-digit'}) : '--:--') 
                            : '--:--';

                        let checkMark = '';
                        if (isSent && !isDeleted) {
                            if (data.status === 'read') {
                                checkMark = `<span class="status-tick-secret read"><i class="fa-solid fa-check-double"></i></span>`;
                            } else if (data.status === 'delivered') {
                                checkMark = `<span class="status-tick-secret delivered"><i class="fa-solid fa-check-double"></i></span>`;
                            } else {
                                checkMark = `<span class="status-tick-secret sent"><i class="fa-solid fa-check"></i></span>`;
                            }
                        }

                        bubbleHtml += `<div class="secret-msg-meta">${timeStr} ${checkMark}</div>`;
                        bubbleHtml += `</div>`;
                        row.innerHTML = bubbleHtml;

                        // Clic pour répondre (sur les messages reçus)
                        if (!isSent && !isDeleted) {
                            row.style.cursor = 'pointer';
                            row.onclick = function(e) {
                                if (e.target.closest('.audio-play-btn') || e.target.closest('.video-wrapper') || e.target.closest('img')) return;
                                initiateReplySecret(data._id);
                            };
                        }

                        msgArea.appendChild(row);
                    });

                    msgArea.scrollTop = msgArea.scrollHeight;
                    isFirstLoad = false;

                }, error => {
                    console.error("Erreur écoute messages:", error);
                });
        }

        // ========== VISIONNEUSE IMAGE PLEIN ÉCRAN ==========
        function openImageFullscreenSecret(url, event) {
            if (event) event.stopPropagation();
            document.getElementById('image-fullscreen-img').src = url;
            document.getElementById('image-fullscreen-overlay').style.display = 'flex';
        }

        function closeImageFullscreenSecret() {
            document.getElementById('image-fullscreen-overlay').style.display = 'none';
            document.getElementById('image-fullscreen-img').src = '';
        }

        // ========== AUDIO PLAYER ==========
        function toggleAudioSecret(btn) {
            const container = btn.closest('.audio-player-container');
            const audio = container.querySelector('audio');
            const icon = btn.querySelector('i');
            const progressFill = container.querySelector('.audio-progress-fill');
            const timeDisplay = container.querySelector('.audio-time');

            if (audio.paused) {
                // Arrêter les autres audios
                document.querySelectorAll('.audio-player-container audio').forEach(a => {
                    if (a !== audio) {
                        a.pause();
                        const otherBtn = a.closest('.audio-player-container').querySelector('.audio-play-btn i');
                        if (otherBtn) otherBtn.className = 'fa-solid fa-play';
                    }
                });
                
                audio.play();
                icon.className = 'fa-solid fa-pause';
                
                audio.addEventListener('timeupdate', function update() {
                    if (audio.duration) {
                        const percent = (audio.currentTime / audio.duration) * 100;
                        progressFill.style.width = percent + '%';
                        const mins = Math.floor(audio.currentTime / 60);
                        const secs = Math.floor(audio.currentTime % 60);
                        timeDisplay.textContent = `${mins}:${secs.toString().padStart(2, '0')}`;
                    }
                });
                
                audio.addEventListener('ended', function() {
                    icon.className = 'fa-solid fa-play';
                    progressFill.style.width = '0%';
                    timeDisplay.textContent = '0:00';
                });
            } else {
                audio.pause();
                icon.className = 'fa-solid fa-play';
            }
        }

        function seekAudioSecret(bar, event) {
            const container = bar.closest('.audio-player-container');
            const audio = container.querySelector('audio');
            const rect = bar.getBoundingClientRect();
            const x = (event.clientX - rect.left) / rect.width;
            if (audio.duration) {
                audio.currentTime = x * audio.duration;
            }
        }

        // ========== TYPING ==========
        function listenToTypingSecret() {
            if (secretTypingUnsubscribe) {
                secretTypingUnsubscribe();
                secretTypingUnsubscribe = null;
            }

            secretTypingUnsubscribe = db.collection('secret_chats').doc(SECRET_CHAT_ID).collection('typing')
                .doc('other_user')
                .onSnapshot(doc => {
                    const typingInd = document.getElementById('typing-ind-secret');
                    const typingTxt = document.getElementById('typing-txt-secret');
                    if (doc.exists && doc.data().isTyping === true) {
                        typingTxt.innerText = `${targetUser.name} écrit...`;
                        typingInd.style.display = 'flex';
                    } else {
                        typingInd.style.display = 'none';
                    }
                });
        }

        function handleTypingSecret() {
            const input = document.getElementById('secret-input');
            const hasText = input.value.trim().length > 0;
            
            db.collection('secret_chats').doc(SECRET_CHAT_ID).collection('typing').doc(currentUser.id)
                .set({ isTyping: hasText, timestamp: firebase.firestore.FieldValue.serverTimestamp() })
                .catch(() => {});

            clearTimeout(typingTimeoutSecret);
            if (hasText) {
                typingTimeoutSecret = setTimeout(() => {
                    db.collection('secret_chats').doc(SECRET_CHAT_ID).collection('typing').doc(currentUser.id)
                        .set({ isTyping: false })
                        .catch(() => {});
                }, 2000);
            }
        }

        // ========== UTILITAIRES ==========
        function escapeHTMLSecret(str) {
            if (!str) return '';
            return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
        }

        function formatTextSecret(text) {
            if (!text) return '';
            let formatted = text;
            formatted = formatted.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            formatted = formatted.replace(/\*(.*?)\*/g, '<em>$1</em>');
            formatted = formatted.replace(/~~(.*?)~~/g, '<del>$1</del>');
            formatted = formatted.replace(/\n/g, '<br>');
            return formatted;
        }

        function isOnlyEmojisSecret(str) {
            if (!str) return false;
            const emojiRegex = /^[\u{1F300}-\u{1F9FF}\u{2700}-\u{27BF}\u{1F600}-\u{1F64F}\u{1F680}-\u{1F6FF}\u{2600}-\u{26FF}\u{1F1E6}-\u{1F1FF}\u{1F900}-\u{1F9FF}\u{1FA70}-\u{1FAFF}]+$/u;
            return emojiRegex.test(str.replace(/\s/g, '')) && str.replace(/\s/g, '').length <= 6;
        }

        function autoResizeSecret() {
            const textarea = document.getElementById('secret-input');
            textarea.style.height = 'auto';
            const maxHeight = 100;
            const newHeight = Math.min(textarea.scrollHeight, maxHeight);
            textarea.style.height = newHeight + 'px';
            textarea.style.overflowY = textarea.scrollHeight > maxHeight ? 'auto' : 'hidden';
        }

        function setupInputEvents() {
            const input = document.getElementById('secret-input');
            const sendBtn = document.getElementById('secret-send-btn');

            input.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendSecretMessage();
                }
            });

            input.addEventListener('input', function() {
                autoResizeSecret();
                const hasText = this.value.trim().length > 0;
                sendBtn.style.opacity = hasText ? '1' : '0.4';
            });
        }

        // ========== TOAST ==========
        function showToastSecret(message) {
            const existing = document.querySelector('.toast-notification');
            if (existing) existing.remove();

            const toast = document.createElement('div');
            toast.className = 'toast-notification';
            toast.innerText = message;
            document.body.appendChild(toast);
            
            setTimeout(() => {
                if (toast.parentNode) toast.remove();
            }, 2500);
        }

        // ========== EMPÊCHER MENU CONTEXTUEL NATIF ========== 
        document.addEventListener('contextmenu', e => e.preventDefault());

        // ========== NETTOYAGE ==========
        window.addEventListener('beforeunload', function() {
            if (secretMessagesUnsubscribe) secretMessagesUnsubscribe();
            if (secretTypingUnsubscribe) secretTypingUnsubscribe();
            if (mediaRecorderSecret && mediaRecorderSecret.state === 'recording') {
                mediaRecorderSecret.stop();
            }
        });

        console.log('📖 Carnet Secret - Version PRO chargée');
    </script>

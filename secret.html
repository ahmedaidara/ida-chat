<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>📖 Carnet Secret - IDA</title>
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        /* ========== ROOT VARIABLES ========== */
        :root {
            --bg-main: #0a0a0a;
            --bg-chat: #0a0a0a;
            --text-main: #f5f5f5;
            --text-muted: #a8a8a8;
            --border-color: #262626;
            --bubble-received: #1e1e1e;
            --bubble-sent: linear-gradient(135deg, #6c00ff, #ff0080);
            --bubble-sent-text: #ffffff;
            --input-bg: #121212;
            --panel-bg: rgba(20, 20, 20, 0.95);
            --accent-color: #a800ff;
            --shadow-color: rgba(168, 0, 255, 0.3);
            --glow-color: rgba(168, 0, 255, 0.2);
        }

        [data-theme="light"] {
            --bg-main: #ffffff;
            --bg-chat: #f0f2f5;
            --text-main: #000000;
            --text-muted: #737373;
            --border-color: #dbdbdb;
            --bubble-received: #ffffff;
            --bubble-sent: linear-gradient(135deg, #6c00ff, #ff0080);
            --input-bg: #ffffff;
            --panel-bg: rgba(255, 255, 255, 0.95);
            --shadow-color: rgba(168, 0, 255, 0.2);
            --glow-color: rgba(168, 0, 255, 0.1);
        }

        /* ========== RESET & BASE ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            background: #000;
            color: #fff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            touch-action: pan-x pan-y;
        }

        input, textarea, select, button {
            touch-action: manipulation;
            font-size: 16px;
            -webkit-user-select: text !important;
            user-select: text !important;
        }

        /* ========== CONTAINER ========== */
        .app-container {
            width: 100%;
            max-width: 450px;
            height: 100vh;
            background: var(--bg-main);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            position: relative;
            border-left: 1px solid var(--border-color);
            border-right: 1px solid var(--border-color);
            overflow: hidden;
        }

        @media(min-width: 800px) {
            .app-container {
                height: 92vh;
                border-radius: 20px;
                box-shadow: 0 12px 40px rgba(0,0,0,0.7);
            }
        }

        /* ========== HEADER ========== */
        .secret-header {
            height: 65px;
            background: linear-gradient(135deg, #1a0a2e, #2d1b69, #1a0a2e);
            background-size: 200% 200%;
            animation: gradientMove 6s ease infinite;
            border-bottom: 2px solid var(--accent-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            flex-shrink: 0;
            position: relative;
            z-index: 10;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .secret-header-left {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
        }

        .secret-header-left .lock-icon {
            font-size: 1.3rem;
            color: #ffd700;
            animation: lockPulse 2s ease infinite;
        }

        @keyframes lockPulse {
            0%, 100% { transform: scale(1); text-shadow: 0 0 0px transparent; }
            50% { transform: scale(1.1); text-shadow: 0 0 20px rgba(255, 215, 0, 0.4); }
        }

        .secret-header-title {
            font-size: 1.1rem;
            font-weight: 700;
            background: linear-gradient(90deg, #ffd700, #ff6b6b, #ffd700);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shimmerText 3s linear infinite;
        }

        @keyframes shimmerText {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        .secret-header-subtitle {
            font-size: 0.6rem;
            color: rgba(255, 255, 255, 0.5);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .secret-header-actions {
            display: flex;
            gap: 18px;
            font-size: 1.2rem;
            color: rgba(255,255,255,0.8);
            cursor: pointer;
        }

        .secret-header-actions i {
            transition: all 0.3s ease;
        }

        .secret-header-actions i:hover {
            transform: scale(1.2);
            color: #ffd700;
        }

        /* ========== ZONE MESSAGES ========== */
        .secret-messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 16px 14px;
            background: var(--bg-chat);
            display: flex;
            flex-direction: column;
            gap: 6px;
            position: relative;
        }

        .secret-messages-area::-webkit-scrollbar {
            width: 4px;
        }

        .secret-messages-area::-webkit-scrollbar-track {
            background: transparent;
        }

        .secret-messages-area::-webkit-scrollbar-thumb {
            background: var(--accent-color);
            border-radius: 10px;
        }

        /* ========== DATE SEPARATOR ========== */
        .date-separator-secret {
            text-align: center;
            font-size: 0.7rem;
            color: var(--text-muted);
            font-weight: 600;
            margin: 12px 0 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.6;
        }

        /* ========== MESSAGES ========== */
        .secret-message-row {
            display: flex;
            width: 100%;
            margin-bottom: 2px;
            animation: fadeInSecret 0.25s ease-out;
        }

        @keyframes fadeInSecret {
            from { opacity: 0; transform: translateY(8px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .secret-message-row.sent {
            justify-content: flex-end;
        }

        .secret-message-row.received {
            justify-content: flex-start;
        }

        .secret-message-bubble {
            max-width: 78%;
            padding: 10px 16px;
            border-radius: 20px;
            font-size: 0.92rem;
            line-height: 1.5;
            position: relative;
            word-wrap: break-word;
            word-break: break-word;
            overflow-wrap: break-word;
            white-space: normal;
            min-width: 50px;
            transition: all 0.2s ease;
        }

        .secret-message-bubble span {
            white-space: pre-wrap;
            display: block;
        }

        .secret-message-row.sent .secret-message-bubble {
            background: var(--bubble-sent);
            color: var(--bubble-sent-text);
            border-bottom-right-radius: 4px;
            box-shadow: 0 2px 12px var(--shadow-color);
        }

        .secret-message-row.received .secret-message-bubble {
            background: var(--bubble-received);
            color: var(--text-main);
            border-bottom-left-radius: 4px;
            border: 1px solid var(--border-color);
        }

        .secret-message-bubble.giant-emoji {
            background: transparent !important;
            padding: 0 !important;
            font-size: 3.8rem !important;
            box-shadow: none !important;
            border: none !important;
            animation: bounceEmojiSecret 0.5s ease-out;
        }

        @keyframes bounceEmojiSecret {
            0% { transform: scale(0.3); opacity: 0; }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); opacity: 1; }
        }

        /* ========== MESSAGE META ========== */
        .secret-msg-meta {
            font-size: 0.65rem;
            opacity: 0.6;
            margin-top: 4px;
            text-align: right;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 4px;
        }

        .secret-message-row.sent .secret-msg-meta {
            color: rgba(255,255,255,0.7);
        }

        .secret-message-row.received .secret-msg-meta {
            color: var(--text-muted);
        }

        /* ========== STATUS TICK ========== */
        .status-tick-secret {
            margin-left: 3px;
        }

        .status-tick-secret.read {
            color: #53bdeb;
        }

        .status-tick-secret.delivered {
            color: #8696a0;
        }

        .status-tick-secret.sent {
            color: #8696a0;
        }

        /* ========== TYPING INDICATOR ========== */
        .typing-indicator-secret {
            display: none;
            align-items: center;
            gap: 8px;
            padding: 6px 16px;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .typing-dots-secret {
            display: flex;
            gap: 4px;
        }

        .typing-dots-secret span {
            width: 7px;
            height: 7px;
            background: var(--text-muted);
            border-radius: 50%;
            animation: bounceDotSecret 1.4s infinite ease-in-out both;
        }

        .typing-dots-secret span:nth-child(1) { animation-delay: -0.32s; }
        .typing-dots-secret span:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounceDotSecret {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        /* ========== INPUT BAR ========== */
        .secret-input-bar {
            padding: 10px 14px 14px;
            background: var(--bg-main);
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 10px;
            align-items: flex-end;
            flex-shrink: 0;
            position: relative;
            z-index: 5;
        }

        .secret-input-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 25px;
            padding: 2px 12px 2px 16px;
            transition: border-color 0.3s ease;
        }

        .secret-input-wrapper:focus-within {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px var(--glow-color);
        }

        .secret-input {
            flex: 1;
            background: transparent;
            border: none;
            padding: 10px 4px;
            font-size: 0.95rem;
            color: var(--text-main);
            outline: none;
            resize: none;
            overflow-y: auto;
            max-height: 120px;
            min-height: 40px;
            line-height: 1.4;
            font-family: 'Inter', sans-serif;
        }

        .secret-input::placeholder {
            color: var(--text-muted);
            opacity: 0.6;
        }

        .secret-input-actions {
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--text-main);
            font-size: 1.1rem;
        }

        .secret-input-actions i {
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .secret-input-actions i:hover {
            color: var(--accent-color);
            transform: scale(1.1);
        }

        .secret-send-btn {
            background: linear-gradient(135deg, var(--accent-color), #ff0080);
            border: none;
            border-radius: 50%;
            width: 44px;
            height: 44px;
            color: white;
            cursor: pointer;
            font-size: 1.2rem;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            box-shadow: 0 2px 12px var(--shadow-color);
        }

        .secret-send-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 20px var(--shadow-color);
        }

        .secret-send-btn:active {
            transform: scale(0.95);
        }

        .secret-send-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        /* ========== EMPTY STATE ========== */
        .secret-empty-state {
            text-align: center;
            color: var(--text-muted);
            padding: 60px 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .secret-empty-state .big-icon {
            font-size: 4rem;
            animation: floatLock 4s ease-in-out infinite;
        }

        @keyframes floatLock {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
        }

        .secret-empty-state h3 {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .secret-empty-state p {
            font-size: 0.85rem;
            opacity: 0.7;
            max-width: 250px;
        }

        /* ========== MODAL SUPPRESSION ========== */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            animation: fadeInModal 0.3s ease;
        }

        @keyframes fadeInModal {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-box {
            background: var(--bg-main);
            border-radius: 24px;
            padding: 30px 25px;
            max-width: 340px;
            width: 90%;
            border: 1px solid var(--border-color);
            text-align: center;
            animation: slideUpModal 0.3s ease;
        }

        @keyframes slideUpModal {
            from { transform: translateY(30px) scale(0.95); opacity: 0; }
            to { transform: translateY(0) scale(1); opacity: 1; }
        }

        .modal-box .modal-icon {
            font-size: 3rem;
            margin-bottom: 12px;
        }

        .modal-box h3 {
            font-size: 1.1rem;
            margin-bottom: 8px;
        }

        .modal-box p {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 20px;
        }

        .modal-actions {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .modal-btn {
            padding: 10px 24px;
            border: none;
            border-radius: 14px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .modal-btn.cancel {
            background: var(--border-color);
            color: var(--text-main);
        }

        .modal-btn.cancel:hover {
            opacity: 0.8;
        }

        .modal-btn.danger {
            background: #ff4444;
            color: white;
        }

        .modal-btn.danger:hover {
            background: #ff2222;
            transform: scale(1.02);
        }

        .modal-btn.confirm {
            background: var(--accent-color);
            color: white;
        }

        .modal-btn.confirm:hover {
            opacity: 0.9;
            transform: scale(1.02);
        }

        /* ========== TOAST NOTIFICATION ========== */
        .toast-notification {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(10px);
            color: white;
            padding: 10px 20px;
            border-radius: 16px;
            font-size: 0.85rem;
            z-index: 2000;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 8px 30px rgba(0,0,0,0.5);
            animation: toastSlide 2.5s ease forwards;
            pointer-events: none;
            max-width: 85%;
            text-align: center;
        }

        @keyframes toastSlide {
            0% { opacity: 0; transform: translateX(-50%) translateY(20px); }
            15% { opacity: 1; transform: translateX(-50%) translateY(0); }
            85% { opacity: 1; transform: translateX(-50%) translateY(0); }
            100% { opacity: 0; transform: translateX(-50%) translateY(-10px); }
        }

        /* ========== RESPONSIVE ========== */
        @media(max-width: 480px) {
            .secret-header-title { font-size: 0.95rem; }
            .secret-header-subtitle { font-size: 0.5rem; }
            .secret-message-bubble { font-size: 0.88rem; padding: 8px 14px; }
            .secret-send-btn { width: 40px; height: 40px; font-size: 1rem; }
        }

        /* ========== SCROLLBAR PERSONNALISÉE ========== */
        .secret-messages-area {
            scroll-behavior: smooth;
        }

        /* ========== ANIMATION DE CHARGEMENT ========== */
        .loading-dots {
            display: flex;
            gap: 6px;
            justify-content: center;
            padding: 20px;
        }

        .loading-dots span {
            width: 10px;
            height: 10px;
            background: var(--accent-color);
            border-radius: 50%;
            animation: loadingBounce 1.4s infinite ease-in-out both;
        }

        .loading-dots span:nth-child(1) { animation-delay: -0.32s; }
        .loading-dots span:nth-child(2) { animation-delay: -0.16s; }
        .loading-dots span:nth-child(3) { animation-delay: 0s; }

        @keyframes loadingBounce {
            0%, 80%, 100% { transform: scale(0); opacity: 0.3; }
            40% { transform: scale(1); opacity: 1; }
        }

        /* ========== DARK MODE TOGGLE ========== */
        .theme-toggle-btn {
            background: none;
            border: none;
            color: rgba(255,255,255,0.8);
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .theme-toggle-btn:hover {
            transform: rotate(30deg);
            color: #ffd700;
        }

        /* ========== BADGE VERROUILLÉ ========== */
        .secret-lock-badge {
            position: absolute;
            top: -6px;
            right: -6px;
            font-size: 0.6rem;
            background: var(--accent-color);
            border-radius: 50%;
            width: 18px;
            height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }

        /* ========== MESSAGE SUPPRIMÉ ========== */
        .secret-message-bubble.deleted {
            background: var(--border-color) !important;
            color: var(--text-muted) !important;
            font-style: italic;
            opacity: 0.6;
        }

        /* ========== CONNEXION PERDUE ========== */
        .connection-banner {
            display: none;
            background: #ff4444;
            color: white;
            text-align: center;
            padding: 6px;
            font-size: 0.75rem;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .connection-banner.show {
            display: block;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from { transform: translateY(-100%); }
            to { transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- BANNER CONNEXION -->
        <div class="connection-banner" id="connection-banner">
            <i class="fa-solid fa-wifi"></i> Connexion perdue - Reconnexion en cours...
        </div>

        <!-- HEADER -->
        <div class="secret-header">
            <div class="secret-header-left" onclick="retournerAccueil()">
                <i class="fa-solid fa-arrow-left" style="color: rgba(255,255,255,0.7); font-size: 1.1rem;"></i>
                <span class="lock-icon"><i class="fa-solid fa-lock"></i></span>
                <div>
                    <div class="secret-header-title">📖 Carnet Secret</div>
                    <div class="secret-header-subtitle">🔒 Conversation privée</div>
                </div>
            </div>
            <div class="secret-header-actions">
                <button class="theme-toggle-btn" onclick="toggleThemeSecret()" title="Changer le thème">
                    <i class="fa-solid fa-moon" id="theme-icon-secret"></i>
                </button>
                <i class="fa-solid fa-trash-can" onclick="ouvrirModalSuppression()" title="Supprimer tous les messages" style="color: #ff6b6b;"></i>
                <i class="fa-solid fa-rotate-right" onclick="rafraichirMessages()" title="Rafraîchir"></i>
            </div>
        </div>

        <!-- ZONE DE MESSAGES -->
        <div class="secret-messages-area" id="secret-msg-area">
            <div class="loading-dots" id="loading-dots">
                <span></span><span></span><span></span>
            </div>
        </div>

        <!-- TYPING INDICATOR -->
        <div class="typing-indicator-secret" id="typing-ind-secret">
            <div class="typing-dots-secret"><span></span><span></span><span></span></div>
            <span id="typing-txt-secret">Quelqu'un écrit...</span>
        </div>

        <!-- INPUT BAR -->
        <div class="secret-input-bar">
            <div class="secret-input-wrapper">
                <textarea class="secret-input" id="secret-input" placeholder="Message secret..." rows="1" oninput="autoResizeTextareaSecret(); handleTypingSecret();"></textarea>
                <div class="secret-input-actions">
                    <i class="fa-regular fa-face-smile" onclick="toggleEmojiPanelSecret()" title="Émojis"></i>
                </div>
            </div>
            <button class="secret-send-btn" id="secret-send-btn" onclick="sendSecretMessage()">
                <i class="fa-regular fa-paper-plane"></i>
            </button>
        </div>

        <!-- PANNEAU ÉMOJIS -->
        <div class="floating-panel" id="emoji-panel-secret" style="display: none; position: absolute; bottom: 80px; left: 15px; right: 15px; background: var(--panel-bg); backdrop-filter: blur(15px); border: 1px solid var(--border-color); border-radius: 16px; padding: 12px; z-index: 20; box-shadow: 0 8px 30px rgba(0,0,0,0.4);">
            <div style="display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; font-size: 1.8rem; text-align: center;">
                <span onclick="insertEmojiSecret('😀')" style="cursor:pointer;">😀</span>
                <span onclick="insertEmojiSecret('😂')" style="cursor:pointer;">😂</span>
                <span onclick="insertEmojiSecret('❤️')" style="cursor:pointer;">❤️</span>
                <span onclick="insertEmojiSecret('🔥')" style="cursor:pointer;">🔥</span>
                <span onclick="insertEmojiSecret('👍')" style="cursor:pointer;">👍</span>
                <span onclick="insertEmojiSecret('🎉')" style="cursor:pointer;">🎉</span>
                <span onclick="insertEmojiSecret('😢')" style="cursor:pointer;">😢</span>
                <span onclick="insertEmojiSecret('😮')" style="cursor:pointer;">😮</span>
                <span onclick="insertEmojiSecret('💀')" style="cursor:pointer;">💀</span>
                <span onclick="insertEmojiSecret('✨')" style="cursor:pointer;">✨</span>
                <span onclick="insertEmojiSecret('💖')" style="cursor:pointer;">💖</span>
                <span onclick="insertEmojiSecret('🌈')" style="cursor:pointer;">🌈</span>
            </div>
        </div>

        <!-- MODAL SUPPRESSION -->
        <div class="modal-overlay" id="modal-delete">
            <div class="modal-box">
                <div class="modal-icon">🗑️</div>
                <h3>Supprimer tous les messages ?</h3>
                <p>Cette action est irréversible. Tous les messages secrets seront définitivement effacés.</p>
                <div class="modal-actions">
                    <button class="modal-btn cancel" onclick="fermerModalSuppression()">Annuler</button>
                    <button class="modal-btn danger" onclick="confirmerSuppressionTotale()">Supprimer tout</button>
                </div>
            </div>
        </div>

    </div>

    <script>
        // ========== CONFIGURATION FIREBASE ==========
        const firebaseConfig = {
            apiKey: "AIzaSyDGC2LQYeSrlb6MRwtLlQGDzz-yJHtKf8c",
            authDomain: "messagerie-65abc.firebaseapp.com",
            projectId: "messagerie-65abc",
            storageBucket: "messagerie-65abc.firebasestorage.app",
            messagingSenderId: "363641716532",
            appId: "1:363641716532:web:d16bd3b4eaf4abf4e8ef61"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // ========== CONSTANTES ==========
        const SECRET_CHAT_ID = "secret_carnet_ida_aidara";
        const USER_ID = "secret_user";
        const USER_NAME = "Utilisateur Secret";

        let secretMessagesUnsubscribe = null;
        let secretTypingUnsubscribe = null;
        let typingTimeoutSecret = null;
        let currentUser = { id: USER_ID, name: USER_NAME };
        let targetUser = { id: "other_secret_user", name: "Correspondant" };

        // ========== ÉTATS ==========
        let isFirstLoad = true;

        // ========== CHARGEMENT ==========
        document.addEventListener('DOMContentLoaded', function() {
            chargerThemeSecret();
            listenToSecretMessages();
            listenToTypingSecret();
            setupInputEvents();
            
            // Focus sur l'input après un délai
            setTimeout(() => {
                document.getElementById('secret-input').focus();
            }, 500);
        });

        // ========== GESTION DU THÈME ==========
        function toggleThemeSecret() {
            const current = document.documentElement.getAttribute('data-theme');
            const target = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', target);
            localStorage.setItem('theme_secret', target);
            updateThemeIconSecret();
        }

        function chargerThemeSecret() {
            const saved = localStorage.getItem('theme_secret') || 'dark';
            document.documentElement.setAttribute('data-theme', saved);
            updateThemeIconSecret();
        }

        function updateThemeIconSecret() {
            const icon = document.getElementById('theme-icon-secret');
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            icon.className = isDark ? 'fa-solid fa-moon' : 'fa-solid fa-sun';
        }

        // ========== RETOUR À L'ACCUEIL ==========
        function retournerAccueil() {
            if (secretMessagesUnsubscribe) {
                secretMessagesUnsubscribe();
                secretMessagesUnsubscribe = null;
            }
            if (secretTypingUnsubscribe) {
                secretTypingUnsubscribe();
                secretTypingUnsubscribe = null;
            }
            window.close();
            // Fallback
            window.location.href = 'index.html';
        }

        // ========== ÉCOUTE DES MESSAGES ==========
        function listenToSecretMessages() {
            if (secretMessagesUnsubscribe) {
                secretMessagesUnsubscribe();
                secretMessagesUnsubscribe = null;
            }

            const msgArea = document.getElementById('secret-msg-area');
            
            secretMessagesUnsubscribe = db.collection('secret_chats').doc(SECRET_CHAT_ID).collection('messages')
                .orderBy('timestamp', 'asc')
                .limitToLast(100)
                .onSnapshot(snapshot => {
                    // Cacher le loader
                    const loader = document.getElementById('loading-dots');
                    if (loader) loader.style.display = 'none';

                    if (snapshot.empty) {
                        msgArea.innerHTML = `
                            <div class="secret-empty-state">
                                <div class="big-icon">🔒</div>
                                <h3>Carnet Secret</h3>
                                <p>Vos messages privés sont chiffrés et sécurisés.</p>
                                <p style="font-size:0.8rem; opacity:0.5;">💬 Envoyez votre premier message secret</p>
                            </div>
                        `;
                        return;
                    }

                    // Nettoyer les anciens messages
                    const existingMessages = msgArea.querySelectorAll('.secret-message-row, .date-separator-secret');
                    existingMessages.forEach(el => el.remove());

                    let lastDateStr = "";
                    let messages = [];

                    snapshot.forEach(doc => {
                        const data = doc.data();
                        data._id = doc.id;
                        messages.push(data);
                    });

                    // Afficher les messages
                    messages.forEach((data, index) => {
                        if (data.timestamp) {
                            const dateObj = data.timestamp.toDate ? data.timestamp.toDate() : new Date(data.timestamp);
                            const dateStr = dateObj.toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' });
                            if (dateStr !== lastDateStr) {
                                const sep = document.createElement('div');
                                sep.className = 'date-separator-secret';
                                sep.innerText = dateStr;
                                msgArea.appendChild(sep);
                                lastDateStr = dateStr;
                            }
                        }

                        const row = document.createElement('div');
                        const isSent = data.senderId === currentUser.id;
                        row.className = `secret-message-row ${isSent ? 'sent' : 'received'}`;
                        row.setAttribute('data-id', data._id);

                        const isGiant = isOnlyEmojisSecret(data.text);
                        const isDeleted = data.isDeleted === true;

                        let bubbleHtml = `<div class="secret-message-bubble ${isGiant ? 'giant-emoji' : ''} ${isDeleted ? 'deleted' : ''}">`;

                        if (isDeleted) {
                            bubbleHtml += `<span style="font-style:italic;">🚫 Message supprimé</span>`;
                        } else {
                            const displayText = formatTextSecret(escapeHTMLSecret(data.text || ''));
                            bubbleHtml += `<span style="white-space: pre-wrap; display: block;">${displayText}</span>`;
                        }

                        const timeStr = data.timestamp ? 
                            (data.timestamp.toDate ? data.timestamp.toDate().toLocaleTimeString('fr-FR', {hour: '2-digit', minute:'2-digit'}) : '--:--') 
                            : '--:--';

                        let checkMark = '';
                        if (isSent && !isDeleted) {
                            if (data.status === 'read') {
                                checkMark = `<span class="status-tick-secret read"><i class="fa-solid fa-check-double"></i></span>`;
                            } else if (data.status === 'delivered') {
                                checkMark = `<span class="status-tick-secret delivered"><i class="fa-solid fa-check-double"></i></span>`;
                            } else {
                                checkMark = `<span class="status-tick-secret sent"><i class="fa-solid fa-check"></i></span>`;
                            }
                        }

                        bubbleHtml += `<div class="secret-msg-meta">${timeStr} ${checkMark}</div>`;
                        bubbleHtml += `</div>`;
                        row.innerHTML = bubbleHtml;

                        // Clic long pour supprimer (sur mobile)
                        row.addEventListener('contextmenu', function(e) {
                            e.preventDefault();
                            if (!isSent || isDeleted) return;
                            if (confirm('Supprimer ce message ?')) {
                                supprimerMessageSecret(data._id);
                            }
                        });

                        // Double clic pour supprimer (sur desktop)
                        row.addEventListener('dblclick', function() {
                            if (!isSent || isDeleted) return;
                            if (confirm('Supprimer ce message ?')) {
                                supprimerMessageSecret(data._id);
                            }
                        });

                        msgArea.appendChild(row);
                    });

                    // Scroll en bas
                    msgArea.scrollTop = msgArea.scrollHeight;
                    isFirstLoad = false;

                }, error => {
                    console.error("Erreur écoute messages:", error);
                    const loader = document.getElementById('loading-dots');
                    if (loader) loader.style.display = 'none';
                    document.getElementById('secret-msg-area').innerHTML = `
                        <div class="secret-empty-state">
                            <div class="big-icon">⚠️</div>
                            <h3>Erreur de connexion</h3>
                            <p>Impossible de charger les messages. Vérifiez votre connexion.</p>
                        </div>
                    `;
                });
        }

        // ========== ÉCOUTE DE LA TYPING ==========
        function listenToTypingSecret() {
            if (secretTypingUnsubscribe) {
                secretTypingUnsubscribe();
                secretTypingUnsubscribe = null;
            }

            const typingInd = document.getElementById('typing-ind-secret');
            const typingTxt = document.getElementById('typing-txt-secret');

            secretTypingUnsubscribe = db.collection('secret_chats').doc(SECRET_CHAT_ID).collection('typing')
                .doc('other_user')
                .onSnapshot(doc => {
                    if (doc.exists && doc.data().isTyping === true) {
                        typingTxt.innerText = `${targetUser.name} écrit...`;
                        typingInd.style.display = 'flex';
                    } else {
                        typingInd.style.display = 'none';
                    }
                }, error => {
                    console.error("Erreur typing:", error);
                });
        }

        // ========== GESTION DE LA TYPING ==========
        function handleTypingSecret() {
            const input = document.getElementById('secret-input');
            const hasText = input.value.trim().length > 0;
            
            db.collection('secret_chats').doc(SECRET_CHAT_ID).collection('typing').doc(currentUser.id)
                .set({ 
                    isTyping: hasText,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                })
                .catch(err => console.error("Erreur typing:", err));

            clearTimeout(typingTimeoutSecret);
            if (hasText) {
                typingTimeoutSecret = setTimeout(() => {
                    db.collection('secret_chats').doc(SECRET_CHAT_ID).collection('typing').doc(currentUser.id)
                        .set({ isTyping: false })
                        .catch(err => console.error("Erreur stop typing:", err));
                }, 2000);
            } else {
                db.collection('secret_chats').doc(SECRET_CHAT_ID).collection('typing').doc(currentUser.id)
                    .set({ isTyping: false })
                    .catch(err => console.error("Erreur stop typing:", err));
            }
        }

        // ========== ENVOYER UN MESSAGE ==========
        async function sendSecretMessage() {
            const input = document.getElementById('secret-input');
            let text = input.value.trim();
            
            if (!text) return;

            // Désactiver le bouton temporairement
            const sendBtn = document.getElementById('secret-send-btn');
            sendBtn.disabled = true;

            const msgData = {
                text: text,
                senderId: currentUser.id,
                senderName: currentUser.name,
                timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                status: "sent",
                readBy: [currentUser.id],
                type: "text"
            };

            input.value = '';
            autoResizeTextareaSecret();
            handleTypingSecret();

            try {
                await db.collection('secret_chats').doc(SECRET_CHAT_ID).collection('messages').add(msgData);
                showToastSecret('✅ Message envoyé');
            } catch(error) {
                console.error("Erreur envoi:", error);
                showToastSecret('❌ Erreur lors de l\'envoi');
                input.value = text;
            }

            sendBtn.disabled = false;
            input.focus();
        }

        // ========== SUPPRIMER UN MESSAGE ==========
        async function supprimerMessageSecret(messageId) {
            if (!messageId) return;
            
            try {
                await db.collection('secret_chats').doc(SECRET_CHAT_ID).collection('messages').doc(messageId).update({
                    isDeleted: true,
                    text: "🚫 Message supprimé",
                    deletedAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                showToastSecret('🗑️ Message supprimé');
            } catch(error) {
                console.error("Erreur suppression:", error);
                showToastSecret('❌ Erreur lors de la suppression');
            }
        }

        // ========== SUPPRESSION TOTALE ==========
        function ouvrirModalSuppression() {
            document.getElementById('modal-delete').style.display = 'flex';
        }

        function fermerModalSuppression() {
            document.getElementById('modal-delete').style.display = 'none';
        }

        async function confirmerSuppressionTotale() {
            fermerModalSuppression();
            
            try {
                const snapshot = await db.collection('secret_chats').doc(SECRET_CHAT_ID).collection('messages').get();
                const batch = db.batch();
                snapshot.docs.forEach(doc => batch.delete(doc.ref));
                await batch.commit();
                showToastSecret('🗑️ Tous les messages ont été supprimés');
            } catch(error) {
                console.error("Erreur suppression totale:", error);
                showToastSecret('❌ Erreur lors de la suppression');
            }
        }

        // ========== RAFRAÎCHIR ==========
        function rafraichirMessages() {
            showToastSecret('🔄 Rafraîchissement...');
            if (secretMessagesUnsubscribe) {
                secretMessagesUnsubscribe();
                secretMessagesUnsubscribe = null;
            }
            setTimeout(() => {
                listenToSecretMessages();
                showToastSecret('✅ Messages actualisés');
            }, 300);
        }

        // ========== PANEL ÉMOJIS ==========
        function toggleEmojiPanelSecret() {
            const panel = document.getElementById('emoji-panel-secret');
            const currentDisplay = panel.style.display;
            panel.style.display = currentDisplay === 'block' ? 'none' : 'block';
        }

        function insertEmojiSecret(emoji) {
            const input = document.getElementById('secret-input');
            const start = input.selectionStart;
            const end = input.selectionEnd;
            const text = input.value;
            input.value = text.substring(0, start) + emoji + text.substring(end);
            input.focus();
            input.selectionStart = input.selectionEnd = start + emoji.length;
            handleTypingSecret();
            document.getElementById('emoji-panel-secret').style.display = 'none';
        }

        // ========== AUTO-RESIZE TEXTAREA ==========
        function autoResizeTextareaSecret() {
            const textarea = document.getElementById('secret-input');
            textarea.style.height = 'auto';
            const maxHeight = 120;
            const newHeight = Math.min(textarea.scrollHeight, maxHeight);
            textarea.style.height = newHeight + 'px';
            textarea.style.overflowY = textarea.scrollHeight > maxHeight ? 'auto' : 'hidden';
        }

        // ========== SETUP INPUT EVENTS ==========
        function setupInputEvents() {
            const input = document.getElementById('secret-input');
            const sendBtn = document.getElementById('secret-send-btn');

            input.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendSecretMessage();
                }
            });

            input.addEventListener('input', function() {
                autoResizeTextareaSecret();
                const hasText = this.value.trim().length > 0;
                sendBtn.style.opacity = hasText ? '1' : '0.4';
            });
        }

        // ========== UTILITAIRES ==========
        function escapeHTMLSecret(str) {
            if (!str) return '';
            return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
        }

        function formatTextSecret(text) {
            if (!text) return '';
            let formatted = text;
            formatted = formatted.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            formatted = formatted.replace(/\*(.*?)\*/g, '<em>$1</em>');
            formatted = formatted.replace(/~~(.*?)~~/g, '<del>$1</del>');
            formatted = formatted.replace(/\n/g, '<br>');
            return formatted;
        }

        function isOnlyEmojisSecret(str) {
            if (!str) return false;
            const emojiRegex = /^[\u{1F300}-\u{1F9FF}\u{2700}-\u{27BF}\u{1F600}-\u{1F64F}\u{1F680}-\u{1F6FF}\u{2600}-\u{26FF}\u{1F1E6}-\u{1F1FF}\u{1F900}-\u{1F9FF}\u{1FA70}-\u{1FAFF}]+$/u;
            return emojiRegex.test(str.replace(/\s/g, '')) && str.replace(/\s/g, '').length <= 6;
        }

        // ========== TOAST NOTIFICATION ==========
        function showToastSecret(message) {
            const existing = document.querySelector('.toast-notification');
            if (existing) existing.remove();

            const toast = document.createElement('div');
            toast.className = 'toast-notification';
            toast.innerText = message;
            document.body.appendChild(toast);
            
            setTimeout(() => {
                if (toast.parentNode) toast.remove();
            }, 2800);
        }

        // ========== FERMER LES PANNEAUX AU CLIC EXTÉRIEUR ==========
        document.addEventListener('click', function(e) {
            const panel = document.getElementById('emoji-panel-secret');
            const trigger = document.querySelector('.secret-input-actions .fa-face-smile');
            if (panel && panel.style.display === 'block' && !panel.contains(e.target) && e.target !== trigger) {
                panel.style.display = 'none';
            }
        });

        // ========== GESTION DE LA CONNEXION ==========
        let reconnectAttempts = 0;
        const maxReconnectAttempts = 5;

        function handleConnectionError() {
            const banner = document.getElementById('connection-banner');
            banner.classList.add('show');
            
            reconnectAttempts++;
            if (reconnectAttempts < maxReconnectAttempts) {
                setTimeout(() => {
                    banner.classList.remove('show');
                    listenToSecretMessages();
                }, 3000);
            } else {
                banner.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i> Connexion impossible - Veuillez rafraîchir la page';
            }
        }

        // ========== EMPÊCHER LE MENU CONTEXTUEL NATIF ==========
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
            return false;
        });

        // ========== NETTOYAGE AU DÉPART ==========
        window.addEventListener('beforeunload', function() {
            if (secretMessagesUnsubscribe) secretMessagesUnsubscribe();
            if (secretTypingUnsubscribe) secretTypingUnsubscribe();
            
            db.collection('secret_chats').doc(SECRET_CHAT_ID).collection('typing').doc(currentUser.id)
                .set({ isTyping: false })
                .catch(() => {});
        });

        console.log('📖 Carnet Secret chargé avec succès !');
        console.log('🔒 Tous les messages sont privés et sécurisés.');
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WhatsApp Voice Call Ultra HD</title>
    
    <!-- SDK Firebase Compat -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        /* Reset & Base */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: #d9b8ff; /* violet pastel doux */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }

        /* Conteneur principal style iPhone */
        .phone-frame {
            width: 100%;
            max-width: 390px;
            aspect-ratio: 9 / 19;
            background: #d9b8ff; /* même violet */
            border-radius: 48px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            padding: 12px 16px 20px;
        }

        /* Barre de statut */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 0 8px;
            color: white;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.2px;
            flex-shrink: 0;
        }
        .status-icons {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .battery {
            background: #e74c3c;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.7rem;
            color: white;
        }

        /* En-tête d'appel */
        .call-header {
            background: rgba(0, 0, 0, 0.08);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border-radius: 40px;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .back-arrow {
            color: white;
            font-size: 1.2rem;
            font-weight: 300;
            line-height: 1;
        }
        .avatar-memoji {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: #b28bdb;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.8rem;
            font-weight: 500;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .contact-info {
            color: white;
        }
        .contact-name {
            font-weight: 700;
            font-size: 1rem;
            letter-spacing: 0.3px;
        }
        .call-status-small {
            font-size: 0.7rem;
            opacity: 0.8;
            font-weight: 400;
        }

        .header-right {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        .icon-circle {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.1rem;
            border: 1px solid rgba(255,255,255,0.1);
            transition: all 0.2s;
            cursor: pointer;
        }
        .icon-circle.red {
            background: #e74c3c;
            border: none;
        }
        .icon-circle.red:hover { background: #c0392b; }

        /* Centre - cercle initiales */
        .center-avatar {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }
        .big-circle {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: #c9a0ff;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 4.2rem;
            font-weight: 600;
            box-shadow: 0 8px 30px rgba(0,0,0,0.1);
            transition: all 0.3s;
        }
        .big-circle.active-call {
            animation: pulse 1.8s infinite;
            background: #b28bdb;
        }
        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255,255,255,0.2); }
            50% { transform: scale(1.04); box-shadow: 0 0 0 12px rgba(255,255,255,0.05); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255,255,255,0); }
        }

        .caller-label {
            color: white;
            font-size: 1.4rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            margin-top: 6px;
        }
        .caller-sub {
            color: rgba(255,255,255,0.7);
            font-size: 0.85rem;
        }

        /* Barre de contrôle en bas */
        .control-bar {
            background: rgba(0, 0, 0, 0.08);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border-radius: 40px;
            padding: 14px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
            border: 1px solid rgba(255, 255, 255, 0.1);
            flex-shrink: 0;
        }
        .ctrl-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.3rem;
            border: 1px solid rgba(255,255,255,0.08);
            transition: all 0.2s;
            cursor: pointer;
        }
        .ctrl-btn.disabled {
            opacity: 0.5;
            background: rgba(255, 255, 255, 0.05);
        }
        .ctrl-btn.red {
            background: #e74c3c;
            border: none;
        }
        .ctrl-btn.red:hover { background: #c0392b; }
        .ctrl-btn:hover { transform: scale(1.05); background: rgba(255,255,255,0.2); }

        /* Login screen overlay */
        #login-screen {
            position: absolute;
            inset: 0;
            background: #d9b8ff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
            z-index: 50;
            border-radius: 48px;
            backdrop-filter: blur(2px);
            transition: opacity 0.4s;
        }
        #login-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .login-card {
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 32px 24px;
            border-radius: 48px;
            width: 100%;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .login-card h2 {
            color: white;
            font-weight: 600;
            font-size: 1.8rem;
            margin-bottom: 6px;
        }
        .login-card p {
            color: rgba(255,255,255,0.7);
            margin-bottom: 20px;
        }
        .profile-options {
            display: flex;
            gap: 16px;
            justify-content: center;
            margin: 16px 0 22px;
        }
        .profile-btn {
            padding: 14px 24px;
            border-radius: 40px;
            border: 2px solid rgba(255,255,255,0.3);
            background: transparent;
            color: white;
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.25s;
            flex: 1;
        }
        .profile-btn.selected {
            background: white;
            color: #b28bdb;
            border-color: white;
        }
        .profile-btn:hover { background: rgba(255,255,255,0.2); }
        .btn-primary {
            background: white;
            color: #b28bdb;
            border: none;
            padding: 14px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 1.1rem;
            width: 100%;
            cursor: pointer;
            transition: all 0.25s;
        }
        .btn-primary:hover { transform: scale(1.02); opacity: 0.9; }

        .saved-info {
            color: rgba(255,255,255,0.5);
            font-size: 0.8rem;
            margin-top: 12px;
        }

        /* Incoming call box (overlay) */
        #incoming-call-box {
            position: absolute;
            top: 30px;
            left: 20px;
            right: 20px;
            background: rgba(0,0,0,0.35);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 40px;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 60;
            border: 1px solid rgba(255,255,255,0.15);
            transform: translateY(-120%);
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            color: white;
        }
        #incoming-call-box.active {
            transform: translateY(0);
        }
        .incoming-actions {
            display: flex;
            gap: 10px;
        }
        .btn-accept, .btn-reject {
            border: none;
            padding: 8px 18px;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-accept { background: #2ecc71; color: white; }
        .btn-reject { background: #e74c3c; color: white; }
        .btn-accept:hover { background: #27ae60; }
        .btn-reject:hover { background: #c0392b; }

        .btn-hangup { display: none; } /* on cache le hangup car on utilise le rouge dans header */

        /* Responsive */
        @media (max-width: 420px) {
            .phone-frame { border-radius: 32px; padding: 10px 12px 16px; }
            .big-circle { width: 110px; height: 110px; font-size: 3.2rem; }
            .control-bar { padding: 10px 14px; }
            .ctrl-btn { width: 42px; height: 42px; font-size: 1.1rem; }
            .contact-name { font-size: 0.9rem; }
        }
    </style>
</head>
<body>

<div class="phone-frame" id="appFrame">

    <!-- Barre de statut -->
    <div class="status-bar">
        <span>17:36</span>
        <div class="status-icons">
            <span>📶</span>
            <span>📶</span>
            <span class="battery">14</span>
        </div>
    </div>

    <!-- En-tête d'appel -->
    <div class="call-header">
        <div class="header-left">
            <span class="back-arrow">‹</span>
            <div class="avatar-memoji" id="headerAvatar">👩🏿</div>
            <div class="contact-info">
                <div class="contact-name" id="headerName">King Marie</div>
                <div class="call-status-small" id="headerStatus">Appelle...</div>
            </div>
        </div>
        <div class="header-right">
            <div class="icon-circle" id="speakerToggle" title="Haut-parleur">🔊</div>
            <div class="icon-circle red" id="hangupBtn" title="Raccrocher">📞</div>
        </div>
    </div>

    <!-- Centre : cercle initiales -->
    <div class="center-avatar">
        <div class="big-circle" id="centerAvatar">AA</div>
        <div class="caller-label" id="centerName">King Marie</div>
        <div class="caller-sub" id="centerStatus">Appel en cours...</div>
    </div>

    <!-- Barre de contrôle en bas -->
    <div class="control-bar">
        <div class="ctrl-btn" id="camToggle">📷</div>
        <div class="ctrl-btn" id="rotateCam">🔄</div>
        <div class="ctrl-btn" id="muteBtn">🎙️</div>
        <div class="ctrl-btn" id="emojiBtn">😊</div>
        <div class="ctrl-btn" id="shareBtn">↗️</div>
    </div>

    <!-- Login Screen -->
    <div id="login-screen">
        <div class="login-card">
            <h2>WhatsApp Voice</h2>
            <p>Choisissez votre profil</p>
            <div class="profile-options">
                <button class="profile-btn" data-profile="IDAET">IDAET</button>
                <button class="profile-btn" data-profile="AIDARA">AIDARA</button>
            </div>
            <button class="btn-primary" id="startBtn">Se connecter</button>
            <div id="savedProfileInfo" class="saved-info"></div>
        </div>
    </div>

    <!-- Incoming call overlay -->
    <div id="incoming-call-box">
        <div>
            <strong id="incomingCallerName">Quelqu'un</strong>
            <div style="font-size:0.75rem; opacity:0.7;">Appel vocal entrant...</div>
        </div>
        <div class="incoming-actions">
            <button class="btn-reject" id="rejectBtn">Refuser</button>
            <button class="btn-accept" id="acceptBtn">Accepter</button>
        </div>
    </div>
</div>

<script>
    // --- CONFIG FIREBASE ---
    const firebaseConfig = {
        apiKey: "AIzaSyDGC2LQYeSrlb6MRwtLlQGDzz-yJHtKf8c",
        authDomain: "messagerie-65abc.firebaseapp.com",
        projectId: "messagerie-65abc",
        storageBucket: "messagerie-65abc.firebasestorage.app",
        messagingSenderId: "363641716532",
        appId: "1:363641716532:web:d16bd3b4eaf4abf4e8ef61"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // --- ÉLÉMENTS DOM ---
    const loginScreen = document.getElementById('login-screen');
    const startBtn = document.getElementById('startBtn');
    const profileBtns = document.querySelectorAll('.profile-btn');
    const savedProfileInfo = document.getElementById('savedProfileInfo');

    const headerName = document.getElementById('headerName');
    const headerStatus = document.getElementById('headerStatus');
    const headerAvatar = document.getElementById('headerAvatar');
    const centerName = document.getElementById('centerName');
    const centerStatus = document.getElementById('centerStatus');
    const centerAvatar = document.getElementById('centerAvatar');
    const hangupBtn = document.getElementById('hangupBtn');
    const speakerToggle = document.getElementById('speakerToggle');
    const muteBtn = document.getElementById('muteBtn');

    const incomingBox = document.getElementById('incoming-call-box');
    const incomingCallerName = document.getElementById('incomingCallerName');
    const acceptBtn = document.getElementById('acceptBtn');
    const rejectBtn = document.getElementById('rejectBtn');

    const camToggle = document.getElementById('camToggle');
    const rotateCam = document.getElementById('rotateCam');
    const emojiBtn = document.getElementById('emojiBtn');
    const shareBtn = document.getElementById('shareBtn');

    // --- ÉTAT GLOBAL ---
    let currentUserId = null;
    let currentUsername = "";
    let selectedProfile = null;
    let localStream = null;
    let peerConnection = null;
    let currentCallId = null;
    let callListener = null;
    let isCallActive = false;
    let isMuted = false;
    let isSpeakerOn = false;

    // Configuration WebRTC
    const peerConfig = {
        iceServers: [
            { urls: 'stun:stun.l.google.com:19302' },
            { urls: 'stun:stun1.l.google.com:19302' }
        ],
        iceTransportPolicy: 'all'
    };

    // --- SAUVEGARDE PROFIL ---
    function saveProfile(p) { localStorage.setItem('wa_voice_profile', p); }
    function getSavedProfile() { return localStorage.getItem('wa_voice_profile'); }

    // --- AUTO-LOGIN ---
    async function autoLogin() {
        const saved = getSavedProfile();
        if (saved) {
            savedProfileInfo.textContent = `👤 Connexion automatique avec ${saved}...`;
            profileBtns.forEach(b => {
                b.classList.remove('selected');
                if (b.dataset.profile === saved) b.classList.add('selected');
            });
            selectedProfile = saved;
            await performLogin();
        }
    }

    // --- LOGIN ---
    async function performLogin() {
        if (!selectedProfile) {
            alert('Choisissez un profil (IDAET ou AIDARA)');
            return;
        }
        currentUsername = selectedProfile;

        try {
            localStream = await navigator.mediaDevices.getUserMedia({
                audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true, sampleRate: 96000, channelCount: 2 },
                video: false
            });

            loginScreen.classList.add('hidden');
            headerName.textContent = currentUsername;
            centerName.textContent = currentUsername;
            headerAvatar.textContent = currentUsername === 'IDAET' ? '👨🏿' : '👩🏿';
            centerAvatar.textContent = currentUsername === 'IDAET' ? 'ID' : 'AA';

            // Créer utilisateur dans Firestore
            const userRef = db.collection('users').doc();
            currentUserId = userRef.id;
            await userRef.set({
                name: currentUsername,
                status: 'online',
                lastActive: firebase.firestore.FieldValue.serverTimestamp(),
                type: 'voice'
            });

            // Écouter les appels entrants
            listenIncomingCalls();

            // Vérifier si l'autre utilisateur est en ligne et lancer un appel automatiquement
            await autoCallOtherUser();

            window.addEventListener('beforeunload', cleanupUser);
        } catch (err) {
            console.error('Micro error:', err);
            alert('Accès au microphone requis.');
        }
    }

    // --- APPEL AUTOMATIQUE VERS L'AUTRE UTILISATEUR ---
    async function autoCallOtherUser() {
        try {
            const snapshot = await db.collection('users')
                .where('status', '==', 'online')
                .where('name', '!=', currentUsername)
                .get();

            if (snapshot.empty) {
                headerStatus.textContent = 'En attente de l\'autre utilisateur...';
                centerStatus.textContent = 'En attente...';
                return;
            }

            const otherDoc = snapshot.docs[0];
            const targetId = otherDoc.id;
            const targetName = otherDoc.data().name;

            // Lancer l'appel
            initiateCall(targetId, targetName);

        } catch (e) {
            console.warn('Auto-call error:', e);
        }
    }

    // --- LANCER UN APPEL ---
    async function initiateCall(targetUserId, targetName) {
        if (isCallActive) return;
        isCallActive = true;

        headerName.textContent = targetName;
        centerName.textContent = targetName;
        centerAvatar.classList.add('active-call');
        headerStatus.textContent = 'Appelle...';
        centerStatus.textContent = 'Appel en cours...';

        await createPeerConnection();

        const callDoc = db.collection('calls').doc();
        currentCallId = callDoc.id;

        const localIce = callDoc.collection('offerCandidates');
        peerConnection.onicecandidate = event => {
            if (event.candidate) localIce.add(event.candidate.toJSON());
        };

        const offer = await peerConnection.createOffer({ offerToReceiveAudio: true, offerToReceiveVideo: false });
        await peerConnection.setLocalDescription(offer);

        await callDoc.set({
            callerId: currentUserId,
            callerName: currentUsername,
            receiverId: targetUserId,
            status: 'ringing',
            offer: offer,
            type: 'voice'
        });

        callListener = callDoc.onSnapshot(async snap => {
            const data = snap.data();
            if (!data) return;

            if (!peerConnection.currentRemoteDescription && data.answer) {
                const answer = new RTCSessionDescription(data.answer);
                await peerConnection.setRemoteDescription(answer);
                headerStatus.textContent = 'En appel';
                centerStatus.textContent = 'En appel';
            }

            if (data.status === 'ended' || data.status === 'rejected') {
                terminateCall();
            }
        });

        callDoc.collection('answerCandidates').onSnapshot(snap => {
            snap.docChanges().forEach(change => {
                if (change.type === 'added') {
                    peerConnection.addIceCandidate(new RTCIceCandidate(change.doc.data()));
                }
            });
        });
    }

    // --- CRÉER PEER CONNECTION ---
    function createPeerConnection() {
        return new Promise((resolve) => {
            peerConnection = new RTCPeerConnection(peerConfig);
            localStream.getTracks().forEach(t => peerConnection.addTrack(t, localStream));

            peerConnection.ontrack = event => {
                // on reçoit le flux distant
                const remoteStream = event.streams[0];
                if (remoteStream) {
                    // on pourrait jouer l'audio dans un élément, mais on garde silencieux
                }
            };

            peerConnection.oniceconnectionstatechange = () => {
                if (peerConnection.iceConnectionState === 'connected') {
                    headerStatus.textContent = 'En appel';
                    centerStatus.textContent = 'En appel';
                }
                if (peerConnection.iceConnectionState === 'disconnected' || peerConnection.iceConnectionState === 'failed') {
                    terminateCall();
                }
            };

            resolve();
        });
    }

    // --- ÉCOUTER APPELS ENTRANTS ---
    function listenIncomingCalls() {
        db.collection('calls')
            .where('receiverId', '==', currentUserId)
            .where('status', '==', 'ringing')
            .where('type', '==', 'voice')
            .onSnapshot(snap => {
                snap.forEach(doc => {
                    const data = doc.data();
                    currentCallId = doc.id;
                    incomingCallerName.textContent = data.callerName || 'Quelqu\'un';
                    incomingBox.classList.add('active');
                });
            });
    }

    // --- ACCEPTER APPEL ---
    acceptBtn.addEventListener('click', async () => {
        incomingBox.classList.remove('active');
        if (!currentCallId) return;

        const callDoc = db.collection('calls').doc(currentCallId);
        const callData = (await callDoc.get()).data();
        if (!callData) return;

        headerName.textContent = callData.callerName;
        centerName.textContent = callData.callerName;
        centerAvatar.classList.add('active-call');
        headerStatus.textContent = 'En appel';
        centerStatus.textContent = 'En appel';

        await createPeerConnection();

        const remoteIce = callDoc.collection('answerCandidates');
        peerConnection.onicecandidate = event => {
            if (event.candidate) remoteIce.add(event.candidate.toJSON());
        };

        const offer = callData.offer;
        await peerConnection.setRemoteDescription(new RTCSessionDescription(offer));
        const answer = await peerConnection.createAnswer();
        await peerConnection.setLocalDescription(answer);
        await callDoc.update({ answer: answer, status: 'accepted' });

        callDoc.collection('offerCandidates').onSnapshot(snap => {
            snap.docChanges().forEach(change => {
                if (change.type === 'added') {
                    peerConnection.addIceCandidate(new RTCIceCandidate(change.doc.data()));
                }
            });
        });

        callListener = callDoc.onSnapshot(snap => {
            const data = snap.data();
            if (data && (data.status === 'ended' || data.status === 'rejected')) {
                terminateCall();
            }
        });

        isCallActive = true;
    });

    // --- REFUSER APPEL ---
    rejectBtn.addEventListener('click', async () => {
        incomingBox.classList.remove('active');
        if (currentCallId) {
            await db.collection('calls').doc(currentCallId).update({ status: 'rejected' });
            currentCallId = null;
        }
    });

    // --- RACCROCHER ---
    hangupBtn.addEventListener('click', async () => {
        if (currentCallId) {
            await db.collection('calls').doc(currentCallId).update({ status: 'ended' });
        }
        terminateCall();
    });

    function terminateCall() {
        if (callListener) callListener();
        if (peerConnection) { peerConnection.close(); peerConnection = null; }
        isCallActive = false;
        currentCallId = null;
        centerAvatar.classList.remove('active-call');
        headerStatus.textContent = 'En ligne';
        centerStatus.textContent = 'En ligne';
        headerName.textContent = currentUsername;
        centerName.textContent = currentUsername;
        incomingBox.classList.remove('active');
        // Relancer un appel automatique si l'autre est en ligne
        setTimeout(autoCallOtherUser, 2000);
    }

    // --- MUTE ---
    muteBtn.addEventListener('click', () => {
        if (!localStream) return;
        const audioTrack = localStream.getAudioTracks()[0];
        if (audioTrack) {
            audioTrack.enabled = !audioTrack.enabled;
            isMuted = !audioTrack.enabled;
            muteBtn.textContent = isMuted ? '🔇' : '🎙️';
        }
    });

    // --- SPEAKER ---
    speakerToggle.addEventListener('click', () => {
        isSpeakerOn = !isSpeakerOn;
        speakerToggle.textContent = isSpeakerOn ? '🔊' : '🔊';
        // Dans un vrai contexte, on utiliserait l'API audio pour basculer le speaker
    });

    // --- NETTOYAGE ---
    async function cleanupUser() {
        if (currentUserId) {
            if (currentCallId) {
                await db.collection('calls').doc(currentCallId).update({ status: 'ended' });
            }
            await db.collection('users').doc(currentUserId).delete();
        }
        if (localStream) {
            localStream.getTracks().forEach(t => t.stop());
            localStream = null;
        }
    }

    // --- SÉLECTION PROFIL ---
    profileBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            profileBtns.forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            selectedProfile = btn.dataset.profile;
            savedProfileInfo.textContent = '';
        });
    });

    startBtn.addEventListener('click', async () => {
        if (!selectedProfile) {
            const saved = getSavedProfile();
            if (saved) {
                profileBtns.forEach(b => {
                    if (b.dataset.profile === saved) b.classList.add('selected');
                });
                selectedProfile = saved;
            } else {
                alert('Choisissez un profil');
                return;
            }
        }
        saveProfile(selectedProfile);
        await performLogin();
    });

    // --- AUTO-LOGIN ---
    autoLogin();

    // Gestion des boutons inutiles (juste pour le style)
    camToggle.addEventListener('click', () => alert('Caméra désactivée (audio only)'));
    rotateCam.addEventListener('click', () => alert('Rotation (non utilisée)'));
    emojiBtn.addEventListener('click', () => alert('😊 Emoji'));
    shareBtn.addEventListener('click', () => alert('Partager'));

</script>
</body>
</html>
